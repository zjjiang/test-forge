<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TestForge 控制台</title>
<style>
/* Layout: 侧栏项目导航 + 右侧工作区；运行详情为「步骤轨道 | 证据面板」两栏，窄屏堆叠 */
:root{
 --bg:#f4f5f7;--card:#ffffff;--line:#dde1e8;--fg:#1a2030;--mut:#5d6679;
 --pri:#2f5bd3;--pri-soft:#e9eefc;
 --side:#151b29;--side-fg:#c3cad8;--side-on:#232c40;--side-mut:#78829a;
 --ok:#24804a;--bad:#c2362f;--rev:#b86a00;--skip:#79808c;
 --th:#f8f9fb;--code:#eef0f4;--warn-bg:#fff5e6;--warn-line:#f0cf9a;
 --stripe-a:#eceef2;--stripe-b:#e4e7ec;
 --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
 --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#10141d;--card:#171c28;--line:#2a3142;--fg:#e3e7ef;--mut:#959eb2;
 --pri:#7f9cff;--pri-soft:#1f2a47;--side:#0b0e15;--side-fg:#c3cad8;--side-on:#1c2333;--side-mut:#6d768c;
 --ok:#4cb877;--bad:#ef6b62;--rev:#e3a043;--skip:#8a919e;
 --th:#1b2130;--code:#222938;--warn-bg:#2b2213;--warn-line:#5c4518;--stripe-a:#1d2331;--stripe-b:#212839}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#10141d;--card:#171c28;--line:#2a3142;--fg:#e3e7ef;--mut:#959eb2;
 --pri:#7f9cff;--pri-soft:#1f2a47;--side:#0b0e15;--side-fg:#c3cad8;--side-on:#1c2333;--side-mut:#6d768c;
 --ok:#4cb877;--bad:#ef6b62;--rev:#e3a043;--skip:#8a919e;
 --th:#1b2130;--code:#222938;--warn-bg:#2b2213;--warn-line:#5c4518;--stripe-a:#1d2331;--stripe-b:#212839}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 var(--f-body);color:var(--fg);background:var(--bg);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app.solo{display:block}
.app.solo main{max-width:none;padding:0 0 40px}
th,td{vertical-align:middle !important}
td .b{display:inline-block}
.flow img{max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.flow figure{margin:0}
.flow figcaption{font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.flow figcaption .mut{font-size:11px;margin-top:1px}
.app.solo .home{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
aside{background:var(--card);border-right:1px solid var(--line);padding-block:18px;padding-left:env(safe-area-inset-left,0px);position:sticky;top:0;align-self:start;min-height:100vh}
aside .back{display:block;padding:4px 16px 14px;color:var(--pri);cursor:pointer;font-size:13px}
aside .pname{font:700 17px/1.25 var(--f-display);font-stretch:88%;padding:0 16px}
aside .purl{font:12px var(--f-mono);color:var(--mut);padding:2px 16px 14px;overflow-wrap:anywhere}
aside nav{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:8px}
aside nav a{display:flex;justify-content:space-between;padding:8px 16px;color:var(--fg);cursor:pointer;border-left:3px solid transparent}
aside nav a:hover{background:var(--pri-soft)}
aside nav a.on{background:var(--pri-soft);border-left-color:var(--pri);color:var(--pri);font-weight:600}
.cnt{font:12px var(--f-mono);color:var(--mut)}
.top{background:var(--side);color:var(--side-fg);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin-bottom:24px}
.top .mut{color:var(--side-mut)}
.brand{font:800 22px/1 var(--f-display);font-stretch:78%;letter-spacing:.03em;text-transform:uppercase;color:#fff}
.brand span{color:#8fa6ff}
.home{max-width:1200px;margin-inline:auto}
h3{font:700 16px/1.3 var(--f-display);margin:28px 0 10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:6px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--pri);box-shadow:0 2px 10px rgba(30,50,110,.10)}
.pcard .ph{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .ph b{font:700 18px/1.25 var(--f-display);font-stretch:90%}
.pcard code{align-self:flex-start}
.pcard dl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.pcard dt{font-size:11px;letter-spacing:.06em;color:var(--mut)}
.pcard dd{margin:0;font:600 18px/1.3 var(--f-display)}
.pf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.strip{display:inline-flex;gap:3px}.strip i{width:8px;height:16px;border-radius:2px;background:var(--skip)}
.strip i.passed{background:var(--ok)}.strip i.failed{background:var(--bad)}.strip i.needs_review{background:var(--rev)}
.form{display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:24px}
main{padding-block:22px 40px;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;width:100%;margin-inline:auto}
.crumb{color:var(--mut);font-size:13px;margin-bottom:6px}.crumb a{color:var(--pri);cursor:pointer}
h2{margin:0 0 14px;font:700 24px/1.2 var(--f-display);font-stretch:88%;text-wrap:balance;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:500;background:var(--th)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pri-soft)}
input,select{font:inherit;color:var(--fg);background:var(--card);padding:5px 8px;border:1px solid var(--line);border-radius:4px;width:100%}
button{font:inherit;color:var(--fg);padding:6px 12px;border-radius:4px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.link{border:0;background:none;color:var(--pri);padding:2px 4px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
code{font-family:var(--f-mono);background:var(--code);padding:1px 5px;border-radius:3px;font-size:12px}
.b{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.b.passed{background:var(--ok)}.b.failed{background:var(--bad)}.b.needs_review{background:var(--rev)}.b.skipped{background:var(--skip)}
.tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid}
.tag.det{color:var(--ok);border-color:var(--ok)}.tag.ai{color:var(--rev);border-color:var(--rev)}
.st.on{background:var(--pri-soft);border-color:var(--pri)}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.flow .srow{grid-column:1/-1;font-size:12px;display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding:3px 2px}
.flow .srow .mut{margin-left:auto;white-space:nowrap}
.flow .srow b{white-space:nowrap}
.flow figcaption b{margin-right:6px}
.shot{aspect-ratio:16/10;max-width:100%;background:repeating-linear-gradient(45deg,var(--stripe-a),var(--stripe-a) 10px,var(--stripe-b) 10px,var(--stripe-b) 20px);border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);font:12px var(--f-mono)}
.att{font:12px var(--f-mono);margin-top:4px}
#lb{position:fixed;inset:0;background:rgba(10,14,22,.86);display:flex;align-items:center;justify-content:center;z-index:50}
#lb[hidden]{display:none}
#lb figure{margin:0;max-width:92vw;display:flex;flex-direction:column}
#lb img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:4px;background:#fff}
#lb figcaption{color:#cfd6e4;font-size:12px;text-align:center;margin-top:8px}
.lb-x{position:fixed;top:12px;right:20px;font-size:24px;background:none;border:0;color:#fff;cursor:pointer}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);font-size:32px;line-height:1;width:46px;height:46px;background:rgba(255,255,255,.14);border:0;color:#fff;cursor:pointer;border-radius:50%}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-nav:disabled{opacity:.25;cursor:default}
.lb-nav:disabled:hover{background:rgba(255,255,255,.14)}
.lb-prev{left:18px}.lb-next{right:18px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);padding:8px 10px;border-radius:4px;font-size:13px}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding-block:10px 0}
 aside nav{flex-direction:row;overflow-x:auto;border-top:0}
 aside nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;gap:6px}
 aside nav a.on{border-bottom-color:var(--pri)}
 .pcard dl{grid-template-columns:repeat(2,minmax(0,1fr))}
 .flow,.fgrid{grid-template-columns:1fr}
 .pgrid{grid-template-columns:1fr}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app.solo main{max-width:none;padding:0 0 40px}
th,td{vertical-align:middle !important}
td .b{display:inline-block}
.flow img{max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.flow figure{margin:0}
.flow figcaption{font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.flow figcaption .mut{font-size:11px;margin-top:1px}
.app.solo .home{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
</style></head><body>
<div class="app" id="app"><aside id="side" hidden></aside><main id="main"></main></div>
<script>
/* API 层：全部走 Fastify，统一信封 {success,data,error} */
async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({ success: false, error: '响应不是 JSON' }));
  if (!res.ok || body.success === false) throw new Error(body.error || ('HTTP ' + res.status));
  return body.data;
}
const j = (method, data) => ({ method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });

var S = { view: 'home', p: null, tab: 'scenarios', run: null, reveal: {}, edit: null, filter: null, creating: false, poll: null };
function go(o) { Object.assign(S, o); if (S.poll) { clearInterval(S.poll); S.poll = null; } if (typeof lb !== 'undefined' && !lb.hidden) closeLb(); render(); }

var CACHE = { projects: null, project: {}, vars: {}, scenarios: {}, runs: {}, run: {} };
function badge(s) { var m = { passed: '通过', failed: '失败', needs_review: '待人工复核', skipped: '跳过', running: '执行中' }; return '<span class="b ' + s + '">' + (m[s] || s) + '</span>'; }
function fmtMs(ms) { return ms >= 10000 ? (ms / 1000).toFixed(0) + 's' : ms + 'ms'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ---------- 首页 ---------- */
function strip(rs) {
  if (!rs.length) return '<span class="mut">还没有执行记录</span>';
  return '<span class="strip">' + rs.slice(0, 10).reverse().map(function (r) { return '<i class="' + r.status + '" title="' + r.id + ' ' + r.status + '"></i>'; }).join('') + '</span>';
}
function passRate(rs) {
  var done = rs.filter(function (r) { return r.status !== 'skipped'; });
  return done.length ? Math.round(100 * done.filter(function (r) { return r.status === 'passed'; }).length / done.length) + '%' : '—';
}
async function viewHome() {
  var projects = CACHE.projects = await api('/api/projects');
  var allRuns = await api('/api/runs?limit=6').catch(function () { return []; });
  var ai = CACHE.ai = await api('/api/ai').catch(function () { return null; });
  var h = '<header class="top"><div class="brand">Test<span>Forge</span></div><span class="mut">Data Forge · 场景驱动的 AI 测试平台</span></header><div class="home">';
  h += '<div class="row"><h2>项目</h2><div style="display:flex;gap:8px"><button onclick="go({aiForm:!S.aiForm})">AI 配置' + (ai && ai.configured ? ' ✓' : '') + '</button><button class="pri" onclick="go({creating:true})">新建项目</button></div></div>';
  if (S.aiForm && ai) h += aiFormHtml(ai);
  if (S.creating) h += newProjectForm();
  h += '<div class="pgrid">';
  for (var p of projects) {
    var rs = await api('/api/projects/' + p.id + '/runs?limit=10').catch(function () { return []; });
    var last = rs[0];
    h += '<button class="pcard" onclick="openProject(\'' + p.id + '\')"><div class="ph"><b>' + esc(p.name) + '</b>' + (last ? badge(last.status) : '') + '</div>'
      + '<div class="mut">' + esc(p.description) + '</div><code>' + esc(p.baseUrl) + '</code>'
      + '<dl><div><dt>执行</dt><dd>' + rs.length + '</dd></div><div><dt>通过率</dt><dd>' + passRate(rs) + '</dd></div></dl>'
      + '<div class="pf">' + strip(rs) + (last ? '<span class="mut">最近 ' + esc((last.startedAt || '').slice(5, 16).replace('T', ' ')) + '</span>' : '') + '</div></button>';
  }
  h += '</div><h3>最近执行</h3><div class="card"><table><tr><th>Run ID</th><th>项目</th><th>场景</th><th>状态</th><th>触发</th><th>时间</th></tr>';
  if (!allRuns.length) h += '<tr><td colspan="6" class="empty">还没有执行记录。</td></tr>';
  for (var r of allRuns) {
    h += '<tr class="click" onclick="openRun(\'' + r.projectId + '\',\'' + r.id + '\')"><td><code>' + esc(r.id) + '</code></td><td>' + esc(r.projectId) + '</td><td>' + esc(r.scenarioName) + '</td><td>' + badge(r.status) + '</td><td>' + esc(r.triggeredBy) + '</td><td class="mut">' + esc((r.startedAt || '').slice(5, 16).replace('T', ' ')) + '</td></tr>';
  }
  return h + '</table></div></div>';
}
function aiFormHtml(ai) {
  return '<div class="card form" style="max-width:640px"><b>AI 配置（全局，Midscene / GLM）</b>'
    + '<div class="mut">ai_action 和视觉断言共用这份配置；项目变量里的 MIDSCENE_* 可以按项目覆盖。</div>'
    + '<div class="fgrid">'
    + '<label>模型族<input id="ai-family" value="' + esc(ai.family || 'anthropic') + '"></label>'
    + '<label>模型名<input id="ai-model" placeholder="glm-5.3" value="' + esc(ai.model) + '"></label>'
    + '<label>Base URL<input id="ai-baseurl" placeholder="https://open.bigmodel.cn/api/anthropic" value="' + esc(ai.baseUrl) + '"></label>'
    + '<label>API Key（' + (ai.hasApiKey ? '已配置，留空保持不变' : '未配置') + '）<input id="ai-key" type="password" placeholder="sk-…"></label>'
    + '</div>'
    + '<div id="ai-result" class="mut"></div>'
    + '<div class="row" style="justify-content:flex-start;margin:0"><button class="pri" onclick="saveAi(false)">保存</button>'
    + '<button onclick="saveAi(true)">保存并测试连接</button>'
    + '<button onclick="go({aiForm:false})">收起</button></div></div>';
}
async function saveAi(test) {
  var v = function (i) { return document.getElementById(i).value.trim(); };
  var body = { family: v('ai-family'), model: v('ai-model'), baseUrl: v('ai-baseurl') };
  var key = document.getElementById('ai-key').value;
  if (key !== '') body.apiKey = key;
  try {
    CACHE.ai = await api('/api/ai', j('PUT', body));
    if (!test) { go({ aiForm: false }); return; }
    document.getElementById('ai-result').textContent = '测试中…（最多等 20 秒）';
    var r = await api('/api/ai/test', { method: 'POST' });
    document.getElementById('ai-result').innerHTML = r.ok
      ? '<span style="color:var(--ok)">✓ 连接正常 · ' + r.ms + 'ms · 模型回复「' + esc(r.reply) + '」</span>'
      : '<span class="err">✗ ' + esc(r.reply) + '</span>';
  } catch (e) {
    document.getElementById('ai-result').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  }
}
function newProjectForm() {
  return '<div class="card form"><b>新建项目</b><div class="fgrid">'
    + '<label>名称<input id="np-name" placeholder="如 HTinns 新平台"></label>'
    + '<label>项目 ID<input id="np-id" placeholder="小写字母/数字/短横线"></label>'
    + '<label>被测地址<input id="np-url" placeholder="http://127.0.0.1:5005"></label>'
    + '<label>说明<input id="np-desc" placeholder="可选"></label></div>'
    + '<div id="np-err" class="err"></div><div class="row" style="justify-content:flex-start;margin:0"><button class="pri" onclick="createProject()">创建并配置变量</button><button onclick="go({creating:false})">取消</button></div></div>';
}
async function createProject() {
  var v = function (i) { return document.getElementById(i).value.trim(); };
  try {
    await api('/api/projects', j('POST', { id: v('np-id'), name: v('np-name'), baseUrl: v('np-url'), description: v('np-desc') }));
    CACHE.projects = null;
    go({ view: 'project', p: v('np-id'), tab: 'vars', creating: false, edit: null, reveal: {} });
  } catch (e) { document.getElementById('np-err').textContent = e.message; }
}

/* ---------- 项目内 ---------- */
var TABS = [['scenarios', '场景'], ['vars', '环境变量'], ['guards', '安全护栏']];
function openProject(id) { go({ view: 'project', p: id, tab: 'scenarios', filter: null, edit: null, reveal: {} }); }
function side(p, counts) {
  var cur = S.view === 'run' ? 'scenarios' : S.tab;
  var h = '<a class="back" onclick="home()">← 全部项目</a><div class="pname">' + esc(p.name) + '</div><div class="purl">' + esc(p.baseUrl) + '</div><nav>';
  TABS.forEach(function (t) {
    h += '<a class="' + (cur === t[0] ? 'on' : '') + '" onclick="go({view:\'project\',tab:\'' + t[0] + '\',filter:null,edit:null})">' + t[1] + '<span class="cnt">' + (counts[t[0]] || 0) + '</span></a>';
  });
  return h + '</nav>';
}
async function viewProject() {
  var pid = S.p;
  var p = await api('/api/projects/' + pid);
  var tab = S.tab;
  /* 计数并行拉全，侧栏不再显示进页前的假 0 */
  var results = await Promise.all([
    api('/api/projects/' + pid + '/scenarios'),
    api('/api/projects/' + pid + '/runs?limit=50'),
    api('/api/projects/' + pid + '/vars'),
  ]);
  CACHE.scenarios[pid] = results[0];
  CACHE.runs[pid] = results[1];
  CACHE.vars[pid] = results[2];
  var counts = { scenarios: results[0].length, vars: results[2].length, guards: p.blockedRoutes.length };
  if (tab === 'scenarios') return { side: side(p, counts), body: await tabScenarios(p, counts) };
  if (tab === 'vars') return { side: side(p, counts), body: await tabVars(p, counts) };
  return { side: side(p, counts), body: tabGuards(p) };
}
async function tabScenarios(p, counts) {
  var items = CACHE.scenarios[S.p];
  var h = '<div class="card"><div class="row"><b>场景</b><span class="mut">场景文件放在仓库 <code>scenarios/' + esc(p.id) + '/</code> 目录，平台自动索引；改动后刷新本页。</span></div><table><tr><th>场景</th><th>角色</th><th>步骤</th><th>依赖 env</th><th>最近结果</th><th></th></tr>';
  if (!items.length) h += '<tr><td colspan="6" class="empty">还没有场景。在 scenarios/' + esc(p.id) + '/ 下放 YAML，或让 Claude Code 按需求生成。</td></tr>';
  items.forEach(function (s) {
    if (!s.valid) {
      h += '<tr><td><b>' + esc(s.file) + '</b></td><td colspan="5" class="err">' + s.issues.map(esc).join('<br>') + '</td></tr>';
      return;
    }
    var last = s.lastRun;
    h += '<tr><td><b title="' + esc(s.file) + '">' + esc(s.name) + '</b></td><td class="mut">' + s.actors.join(' → ') + '</td><td>' + s.steps + '</td>'
      + '<td class="mut">' + (s.requires.length ? s.requires.join(', ') : '—') + '</td><td>' + (last ? badge(last.status) : '—') + '</td>'
      + '<td>' + (last ? '<button title="查看这次执行：' + esc(last.id) + '" onclick="openRun(\'' + esc(p.id) + '\',\'' + esc(last.id) + '\')">报告</button> ' : '')
      + '<button onclick="triggerRun(\'' + esc(p.id) + '\',\'' + esc(s.file) + '\',this)">运行</button></td></tr>';
  });
  h += '</table></div>';
  h += '<h3>执行记录</h3><div class="card"><table><tr><th>Run ID</th><th>场景</th><th>状态</th><th>耗时</th><th>触发</th><th>时间</th></tr>';
  if (!CACHE.runs[S.p].length) h += '<tr><td colspan="6" class="empty">还没有执行记录。点上面的「运行」开始第一次执行。</td></tr>';
  CACHE.runs[S.p].forEach(function (r) {
    h += '<tr class="click" onclick="openRun(\'' + p.id + '\',\'' + r.id + '\')"><td><code>' + esc(r.id) + '</code></td><td>' + esc(r.scenarioName) + '</td><td>' + badge(r.status) + '</td><td>' + fmtMs(r.durationMs) + '</td><td>' + esc(r.triggeredBy) + '</td><td class="mut">' + esc((r.startedAt || '').slice(5, 16).replace('T', ' ')) + '</td></tr>';
  });
  return h + '</table></div>';
}

async function tabVars(p, counts) {
  var vars = CACHE.vars[S.p];
  var h = '<div class="card"><div class="row"><div><b>Global 环境变量</b><div class="mut">项目内所有场景可用，场景里用 <code>${var:NAME}</code> 引用。优先级：项目 global &lt; 场景 variables &lt; --var。secret 加密存储，快照和日志一律脱敏。</div></div></div>';
  h += '<table><tr><th style="width:22%">Key</th><th style="width:30%">Value</th><th>Secret</th><th>说明</th><th style="width:110px"></th></tr>';
  vars.forEach(function (v, i) {
    var shown = v.isSecret && !S.reveal[i] ? '••••••••' : v.value;
    h += '<tr><td><code>' + esc(v.key) + '</code></td><td>' + esc(shown) + (v.isSecret ? ' <button class="link" onclick="S.reveal[' + i + ']=!S.reveal[' + i + '];render()">显示/隐藏</button>' : '') + '</td><td>' + (v.isSecret ? '是' : '') + '</td><td class="mut">' + esc(v.note) + '</td><td><button class="link" onclick="editVar(' + i + ')">编辑</button><button class="link" style="color:var(--bad)" onclick="delVar(' + i + ')">删除</button></td></tr>';
  });
  var e = S.edit != null ? vars[S.edit] || {} : null;
  h += '<tr><td><input id="vk" placeholder="NEW_KEY" value="' + (e ? esc(e.key) : '') + '"' + (e ? ' readonly' : '') + '></td>'
    + '<td><input id="vv" placeholder="value" value="' + (e && !e.isSecret ? esc(e.value) : '') + '" type="' + (e && e.isSecret ? 'password' : 'text') + '"></td>'
    + '<td><input id="vs" type="checkbox" style="width:auto"' + (e && e.isSecret ? ' checked' : '') + '></td>'
    + '<td><input id="vn" placeholder="说明（可选）" value="' + (e ? esc(e.note) : '') + '"></td>'
    + '<td><button class="pri" onclick="saveVar()">' + (e ? '保存' : '添加') + '</button></td></tr>';
  return h + '</table><div id="verr" class="err"></div></div>';
}
async function saveVar() {
  var key = document.getElementById('vk').value.trim();
  var input = { value: document.getElementById('vv').value, isSecret: document.getElementById('vs').checked, note: document.getElementById('vn').value };
  try {
    await api('/api/projects/' + S.p + '/vars/' + encodeURIComponent(key), j('PUT', input));
    go({ edit: null, reveal: {} });
  } catch (e) { document.getElementById('verr').textContent = e.message; }
}
function editVar(i) { go({ edit: i }); }
async function delVar(i) {
  var v = CACHE.vars[S.p][i];
  if (!v) return;
  if (!window.confirm('删除变量「' + v.key + '」？')) return;
  await api('/api/projects/' + S.p + '/vars/' + encodeURIComponent(v.key), { method: 'DELETE' });
  go({ edit: null, reveal: {} });
}
function tabGuards(p) {
  var h = '<div class="card"><b>拦截的高危接口</b><div class="mut">命中后 route 层直接 abort，并写进 execution.log，场景判失败。</div><table style="margin-top:8px">';
  (p.blockedRoutes.length ? p.blockedRoutes : ['（无）']).forEach(function (b) { h += '<tr><td><code>' + esc(b) + '</code></td></tr>'; });
  h += '</table><div class="row" style="margin-top:12px"><input id="guard-new" placeholder="新增拦截规则，如 */admin/*"><button onclick="addGuard()">添加</button></div></div>';
  h += '<div class="card"><b>数据前缀</b><div class="mut">测试数据命名前缀（如 E2E-），提示给 AI 生成场景时遵守。</div><div style="margin-top:8px"><code>' + esc(p.dataPrefix || '（未设置）') + '</code></div></div>';
  return h;
}
async function addGuard() {
  var v = document.getElementById('guard-new').value.trim();
  var p = await api('/api/projects/' + S.p);
  var routes = p.blockedRoutes.concat(v ? [v] : []);
  await api('/api/projects/' + S.p + '/guards', j('PUT', { blockedRoutes: routes }));
  render();
}

/* ---------- Run 详情 ---------- */
function openRun(pid, runId) { go({ view: 'run', p: pid, run: runId }); }
async function viewRun() {
  var data = await api('/api/projects/' + S.p + '/runs/' + S.run);
  var run = data.run, summary = data.summary;
  if (run.status === 'running') {
    if (!S.poll) S.poll = setInterval(function () { render(); }, 2000);
    if (!summary) {
      return { side: side({ name: run.scenarioName, baseUrl: '' }, {}), body: '<div class="card empty"><h2>执行中… ' + badge('running') + '</h2><div class="mut">浏览器正在执行场景，每 2 秒自动刷新；完成后展示截图证据。</div></div>' };
    }
  }
  var steps = (summary && summary.steps) || [];
  var det = 0, ai = 0;
  steps.forEach(function (s) { (s.assertions || []).forEach(function (a) { if (a.kind === 'det') det++; else ai++; }); });
  var base = '/api/projects/' + S.p + '/runs/' + S.run + '/files/';
  /* 灯箱序列 = 全 run 截图，按步骤顺序（渲染时同步建） */
  S.shots = [];
  var h = '<div class="crumb"><a onclick="home()">首页</a> / <a onclick="openProject(\'' + S.p + '\')">' + esc(S.p) + '</a> / Run ' + esc(run.id) + '</div>';
  h += '<h2>' + esc(run.scenarioName) + ' ' + badge(run.status) + '</h2>';
  h += '<div class="mut" style="margin-bottom:10px">run <code>' + esc(run.id) + '</code> · 耗时 ' + fmtMs(run.durationMs) + ' · 断言（确定性/AI）' + det + ' / ' + ai + ' · 触发 ' + esc(run.triggeredBy || '—') + ' · ' + esc((run.startedAt || '').slice(5, 16).replace('T', ' ')) + '</div>';
  h += '<div class="row" style="justify-content:flex-start;margin-bottom:14px"><a href="' + base + 'report.html" target="_blank"><button>完整报告</button></a><span class="mut">细节： <a href="' + base + 'summary.json" target="_blank">summary.json</a> · <a href="' + base + 'scenario.yaml" target="_blank">scenario.yaml</a> · <a href="' + base + 'trace-' + esc(steps.length && steps[0].actor ? steps[0].actor : 'user') + '.zip">trace.zip</a></span></div>';
  var bad = steps.filter(function (st) { return st.status === 'failed' || st.status === 'warned'; });
  if (bad.length) {
    h += '<div class="warn" style="margin-bottom:14px"><b>' + bad.length + ' 步未通过：</b>'
      + bad.map(function (st) { return '<b>' + esc(st.stepId) + '</b>' + (st.error ? '（' + esc(st.error.slice(0, 90)) + '）' : ''); }).join('；')
      + '</div>';
  }
  h += '<div class="flow">';
  if (!steps.length) h += '<span class="mut">（本次执行没有步骤）</span>';
  steps.forEach(function (st, si) {
    var shots = st.shots || [];
    var cap = '<b>' + (si + 1) + '. ' + esc(st.stepId) + '</b>' + badge(st.status)
      + (st.expect && st.expect !== st.stepId ? '<span class="mut">' + esc(st.expect) + '</span>' : '');
    if (!shots.length) {
      /* 没截图的步骤：一行细条，不跳步 */
      h += '<div class="srow">' + cap + '<span class="mut">' + (st.ms || 0) + 'ms · 无截图</span></div>';
      return;
    }
    shots.forEach(function (f) {
      var label = '步骤 ' + (si + 1) + ' ' + st.stepId + (st.expect && st.expect !== st.stepId ? ' — ' + st.expect : '');
      var idx = S.shots.length;
      S.shots.push({ src: base + f, caption: label + ' · ' + f });
      h += '<figure><img src="' + base + esc(f) + '" loading="lazy" style="max-width:100%;cursor:zoom-in" onclick="lbOpen(' + idx + ')" title="点击放大">'
        + '<figcaption>' + cap + '<div class="mut">' + esc(f) + '</div></figcaption></figure>';
    });
  });
  h += '</div>';
  return { side: side({ name: run.scenarioName, baseUrl: '' }, {}), body: h };
}

/* ---------- 渲染循环 ---------- */
async function triggerRun(pid, file, btn) {
  var old = btn ? btn.textContent : '';
  if (!window.confirm('开始执行场景「' + file + '」？浏览器会在后台运行并逐步留痕。')) return;
  if (btn) { btn.disabled = true; btn.textContent = '启动中…'; }
  try {
    var r = await api('/api/projects/' + pid + '/runs', j('POST', { file: file, triggeredBy: 'web' }));
    CACHE.runs[pid] = null;
    openRun(pid, r.runId);
  } catch (e) {
    window.alert('触发失败：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = old; }
  }
}
function home() { go({ view: 'home', p: null }); }
async function render() {
  var app = document.getElementById('app'), sideEl = document.getElementById('side'), main = document.getElementById('main');
  try {
    if (S.view === 'home') {
      app.className = 'app solo'; sideEl.hidden = true;
      main.innerHTML = '<div class="home"><div class="mut">加载中…</div></div>';
      main.innerHTML = await viewHome();
      return;
    }
    var view = S.view === 'project' ? await viewProject() : await viewRun();
    app.className = 'app'; sideEl.hidden = false;
    sideEl.innerHTML = view.side;
    main.innerHTML = view.body;
  } catch (e) {
    main.innerHTML = '<div class="card"><b>加载失败</b><div class="err">' + esc(e.message) + '</div><div class="mut">确认服务在运行：<code>pnpm tf serve</code></div></div>';
  }
}
/* ---------- 截图灯箱：放大查看，‹ › 或键盘 ←/→ 按 run 内顺序翻页 ---------- */
var lb = document.createElement('div');
lb.id = 'lb'; lb.hidden = true;
lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
document.body.appendChild(lb);
document.addEventListener('keydown', function (e) {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') lbGo(-1);
  else if (e.key === 'ArrowRight') lbGo(1);
});
function lbOpen(i) { S.lb = i; drawLb(); lb.hidden = false; }
function closeLb() { lb.hidden = true; S.lb = null; }
function lbGo(d) {
  if (S.lb == null || !S.shots.length) return;
  var next = S.lb + d;
  if (next < 0 || next >= S.shots.length) return; // 到头就停，不循环
  S.lb = next; drawLb();
}
function drawLb() {
  var s = S.shots[S.lb];
  lb.innerHTML = '<button class="lb-x" title="关闭 (Esc)" onclick="closeLb()">×</button>'
    + (S.shots.length > 1 ? '<button class="lb-nav lb-prev" title="上一张 (←)" onclick="lbGo(-1)"' + (S.lb === 0 ? ' disabled' : '') + '>‹</button><button class="lb-nav lb-next" title="下一张 (→)" onclick="lbGo(1)"' + (S.lb === S.shots.length - 1 ? ' disabled' : '') + '>›</button>' : '')
    + '<figure><img src="' + esc(s.src) + '" alt=""><figcaption>' + esc(s.caption) + ' · ' + (S.lb + 1) + ' / ' + S.shots.length + '</figcaption></figure>';
}

window.addEventListener('beforeunload', function () { if (S.poll) clearInterval(S.poll); });
render();
</script></body></html>
