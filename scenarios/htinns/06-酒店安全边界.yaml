# 场景六：酒店管理安全边界（哨兵场景，专职盯防，不与主链路混跑）
# ① 越权：店侧 POST 编辑他店（新乡旅途）酒店 → 404 不泄露存在性；目标 id 走项目变量 OTHER_HOTEL_ID
# ② 非法输入：打标提交非法标签值 → 302 + danger flash「非法status_tag: …」，原标签不变
# 夹具：E2E 店 + 1 家带 SHID 酒店（打标需要）
name: 酒店安全边界
description: 对应用户场景 5 安全部分；越权 404 与非法标签输入的专职哨兵
version: 2
trace: false
requires:
  env: [OTHER_HOTEL_ID]
variables:
  shopName: "E2E-哨兵-${var:RUN_STAMP}"
  shopUser: "e2esec_${var:RUN_DATE}${var:RUN_TIME}"
actors:
  admin:
    description: 管理员
    dialogs: accept
  shop:
    description: E2E 测试店铺身份
    dialogs: accept
steps:
  - id: 管理员登录并新增E2E店
    type: flow
    expect: admin 登录成功并创建 E2E 测试店
    steps:
      - id: admin打开登录页
        as: admin
        type: navigate
        url: /login
      - id: admin填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: admin填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: admin提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: admin登录成功
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 等店铺列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 点击增加店铺
        as: admin
        type: click
        selector: '#btn-add-shop'
        waitFor: '#adddlg[open]'
      - id: 填写店铺名
        as: admin
        type: fill
        selector: '#adddlg input[name="name"]'
        value: ${var:shopName}
      - id: 填写店铺账号
        as: admin
        type: fill
        selector: '#adddlg input[name="username"]'
        value: ${var:shopUser}
      - id: 保存新店
        as: admin
        type: click
        selector: '#adddlg button.btn'
      - id: E2E店创建成功
        as: admin
        type: dom_assert
        selector: '.content .flash'
        contains: 已创建
  - id: 店侧登录并备夹具酒店
    type: flow
    expect: 店侧登录成功，新增 1 家带 SHID 酒店（打标探测用）
    steps:
      - id: 店铺账号打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 基线登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
      - id: 打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 新增夹具酒店
        as: shop
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
      - id: 填名称
        as: shop
        type: fill
        selector: '#hotelform input[name="hotel_name"]'
        value: E2E-哨兵酒店
      - id: 填SHID
        as: shop
        type: fill
        selector: '#hotelform input[name="fliggy_shid"]'
        value: E2E-SEC-001
      - id: 填城市
        as: shop
        type: fill
        selector: '#hotelform input[name="city_name"]'
        value: 郑州
      - id: 保存
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: flash已新增
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已新增酒店
      - id: 夹具酒店打上白名单
        as: shop
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("E2E-哨兵酒店")) select[name="status_tag"]'
        value: 白名单酒店
      - id: 等打标提交完成
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已更新
      - id: 等打标回显
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 15000
        script: '(() => { const s = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-哨兵酒店")); if (s === undefined) return false; const v = s.querySelector("select[name=\"status_tag\"]"); return v !== null && v.value === "白名单酒店"; })()'
        truthy: true
        expect: 夹具酒店当前标签=白名单（供越权后比对不变）
  - id: 越权编辑他店酒店被404
    type: flow
    expect: 店侧直接 POST 编辑他店（新乡旅途）酒店 → 404，不泄露存在性
    steps:
      - id: 店侧越权POST他店酒店更新
        as: shop
        type: http
        method: POST
        path: /hotels/${var:OTHER_HOTEL_ID}/update
        form:
          hotel_name: E2E-越权尝试改名
          city_name: 黑客市
        expectStatus: 404
        expect: 越权编辑返回 404（不泄露他店酒店存在性）
  - id: 非法标签值被拒
    type: flow
    expect: 打标提交非法值 → 302 回列表 + danger 提示「非法status_tag」，原白名单标签不变
    steps:
      - id: POST非法标签值
        as: shop
        type: http
        method: POST
        path: /hotels/tag
        form:
          fliggy_shid: E2E-SEC-001
          status_tag: 恶意标签<script>
          back: board
        maxRedirects: 0
        expectStatus: 302
        expect: 非法值被拒并 302 回列表
      - id: 列表出现非法提示
        as: shop
        type: navigate
        url: /hotels
      - id: flash含非法status_tag
        as: shop
        type: js_assert
        script: '(document.querySelector(".content .flash") || { textContent: "" }).textContent'
        contains: 非法status_tag
        expect: danger flash 提示非法值
      - id: 原标签仍为白名单
        as: shop
        type: js_assert
        script: '(() => { const s = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-哨兵酒店")); if (s === undefined) return false; const v = s.querySelector("select[name=\"status_tag\"]").value; return v === "白名单酒店"; })()'
        truthy: true
        expect: 非法提交未改变原标签（仍白名单）
teardown:
  - id: 收尾停用E2E店留档
    type: flow
    expect: E2E 店若仍在营则停用留档
    steps:
      - id: 收尾等登录完成
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 收尾打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 收尾等列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 停用E2E店留档（仅当仍在营）
        as: admin
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
        when: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); return ((row || {}).querySelector ? (row.querySelector(".pill") || { textContent: "" }).textContent : "").trim() === "在营"; })()'
        onFail: warn
