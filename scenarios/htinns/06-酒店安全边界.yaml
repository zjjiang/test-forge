# 场景六 v2：酒店管理安全边界（哨兵场景；数据纪律：复用固定夹具店，不新增店铺）
# 夹具店 E2E-读写-1105-134852（shop_id=113，初始密码 123456）；哨兵酒店重复执行走 upsert 更新
# ① 越权：店侧 POST 编辑他店（新乡旅途）酒店 → 404 不泄露存在性；目标 id 走项目变量 OTHER_HOTEL_ID
# ② 非法输入：打标提交非法标签值 → 302 + danger flash「非法status_tag: …」，原标签不变
name: 酒店安全边界
description: 对应用户场景 5 安全部分；越权 404 与非法标签输入的专职哨兵（复用夹具店不新增）
version: 2
trace: false
requires:
  env: [OTHER_HOTEL_ID]
variables:
  shopUser: "e2erw_20261105134852"
actors:
  shop:
    description: 夹具店铺身份（E2E-读写-1105-134852）
    dialogs: accept
steps:
  - id: 店侧登录并备夹具酒店
    type: flow
    expect: 夹具店登录成功；哨兵酒店就绪（首次新增/重复更新）且打上白名单
    steps:
      - id: 店铺账号打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 基线登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
      - id: 打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 打开新增弹窗
        as: shop
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
      - id: 填名称
        as: shop
        type: fill
        selector: '#hotelform input[name="hotel_name"]'
        value: E2E-哨兵酒店
      - id: 填SHID
        as: shop
        type: fill
        selector: '#hotelform input[name="fliggy_shid"]'
        value: E2E-SEC-001
      - id: 填城市
        as: shop
        type: fill
        selector: '#hotelform input[name="city_name"]'
        value: 郑州
      - id: 保存
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: flash落库
        as: shop
        type: js_assert
        script: '/(已新增酒店|已更新既有酒店)/.test((document.querySelector(".content .flash") || { textContent: "" }).textContent)'
        truthy: true
        expect: 哨兵酒店就绪（新增或更新均认可）
      - id: 夹具酒店打上白名单
        as: shop
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("E2E-哨兵酒店")) select[name="status_tag"]'
        value: 白名单酒店
      - id: 等打标提交完成
        as: shop
        type: js_assert
        script: '/(已更新|标签无变更)/.test((document.querySelector(".content .flash") || { textContent: "" }).textContent)'
        truthy: true
        expect: 打标提交被受理（变更报已更新，重复值报无变更）
      - id: 等打标回显
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 15000
        script: '(() => { const s = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-哨兵酒店")); if (s === undefined) return false; const v = s.querySelector("select[name=\"status_tag\"]"); return v !== null && v.value === "白名单酒店"; })()'
        truthy: true
        expect: 夹具酒店当前标签=白名单（供越权后比对不变）
  - id: 越权编辑他店酒店被404
    type: flow
    expect: 店侧直接 POST 编辑他店（新乡旅途）酒店 → 404，不泄露存在性
    steps:
      - id: 店侧越权POST他店酒店更新
        as: shop
        type: http
        method: POST
        path: /hotels/${var:OTHER_HOTEL_ID}/update
        form:
          hotel_name: E2E-越权尝试改名
          city_name: 黑客市
        expectStatus: 404
        expect: 越权编辑返回 404（不泄露他店酒店存在性）
  - id: 非法标签值被拒
    type: flow
    expect: 打标提交非法值 → 302 回列表 + danger 提示「非法status_tag」，原白名单标签不变
    steps:
      - id: POST非法标签值
        as: shop
        type: http
        method: POST
        path: /hotels/tag
        form:
          fliggy_shid: E2E-SEC-001
          status_tag: 恶意标签<script>
          back: board
        maxRedirects: 0
        expectStatus: 302
        expect: 非法值被拒并 302 回列表
      - id: 列表出现非法提示
        as: shop
        type: navigate
        url: /hotels
      - id: flash含非法status_tag
        as: shop
        type: js_assert
        script: '(document.querySelector(".content .flash") || { textContent: "" }).textContent'
        contains: 非法status_tag
        expect: danger flash 提示非法值
      - id: 原标签仍为白名单
        as: shop
        type: js_assert
        script: '(() => { const s = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-哨兵酒店")); if (s === undefined) return false; const v = s.querySelector("select[name=\"status_tag\"]"); return v !== null && v.value === "白名单酒店"; })()'
        truthy: true
        expect: 非法提交未改变原标签（仍白名单）
