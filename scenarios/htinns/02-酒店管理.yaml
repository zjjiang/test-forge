# 场景二：酒店管理页 /hotels（迁移自 htinns-test e2e/test_02_hotels.py）
# 主线：admin 只读走查（切店/搜索/标签/分页）+ E2E 店写链路（新增→编辑→打标→停启用→导出）
# 硬规则：真实店（新乡旅途，shop_id=7）数据一律只读；写操作全部以 E2E 店身份
name: 酒店管理
description: 对应用例 H01-H11、HS01-HS03；H11 为已知产品 bug 的缺陷证据（onFail warn）
version: 1
requires:
  env: []
variables:
  shopName: "E2E-酒店迁移店-${var:RUN_STAMP}"
  shopUser: "e2e_mig2_${var:RUN_DATE}${var:RUN_TIME}"
  hotelName: E2E测试酒店
  hotelShid: E2ESH0001
actors:
  admin:
    description: 管理员
    dialogs: accept
  e2e:
    description: E2E 测试店铺身份（写操作落 E2E 店）
    dialogs: accept
guards:
  blockedRoutes:
    - "*/maintain/push/run"
steps:
  - id: 管理员登录与默认列表走查
    type: flow
    expect: 登录成功进入平台；酒店页 KPI 三卡、新增/导入/导出入口齐备，计数条以「共」开头
    steps:
      # ---------- admin 登录 ----------
      - id: 管理员打开登录页
        as: admin
        type: navigate
        url: /login
      - id: 管理员填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: 管理员填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: 管理员提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: admin登录成功
        as: admin
        type: wait
        selector: '.topbar .usermenu'
        expect: admin 登录成功
      # ---------- H01 admin 默认列表 ----------
      - id: 打开酒店管理页
        as: admin
        type: navigate
        url: /hotels
        expect: 打开酒店管理页
      - id: KPI三卡齐备
        as: admin
        type: dom_assert
        selector: '.kpirow .kpi'
        count: 3
        expect: KPI 三卡齐备
      - id: 新增入口可见
        as: admin
        type: dom_assert
        selector: '#btn-new'
        state: visible
        expect: 新增入口可见
      - id: 导入入口可见
        as: admin
        type: dom_assert
        selector: '#btn-import'
        state: visible
        expect: 导入入口可见
      - id: 导出入口可见
        as: admin
        type: dom_assert
        selector: 'a.chip[href*="/hotels/export"]'
        state: visible
        expect: 导出入口可见
      - id: 计数条以「共」开头
        as: admin
        type: js_assert
        script: 'Array.from(document.querySelectorAll("p.note")).some((e) => e.textContent.trim().startsWith("共"))'
        truthy: true
        expect: 计数条以「共」开头
  - id: admin切店查看真实店
    type: flow
    expect: 切到新乡旅途后列表有酒店行，KPI 含在营酒店
    steps:
      # ---------- H02 admin 切店 ----------
      - id: 打开酒店管理页
        as: admin
        type: navigate
        url: /hotels
      - id: 切到新乡旅途（onchange自动提交）
        as: admin
        type: select
        selector: 'select[name="shop_id"]'
        value: "7"
        expect: 切到新乡旅途（onchange 自动提交）
      - id: 等酒店列表加载
        as: admin
        type: wait
        selector: '.tbl tbody tr'
      - id: 新乡旅途有酒店行
        as: admin
        type: dom_assert
        selector: '.tbl tbody tr'
        countAtLeast: 1
        expect: 新乡旅途有酒店行
      - id: KPI含在营酒店
        as: admin
        type: js_assert
        script: '(document.querySelector(".kpirow") || { textContent: "" }).textContent.includes("在营酒店")'
        truthy: true
        expect: KPI 含在营酒店
  - id: admin搜索与标签筛选
    type: flow
    expect: 回车搜索命中行名称均含关键词；黑名单标签筛选命中行状态一致（或空态）
    steps:
      # ---------- H03 admin 搜索 ----------
      - id: 打开酒店搜索页
        as: admin
        type: navigate
        url: /hotels?shop_id=7
      - id: 取首行酒店名作关键词
        as: admin
        type: extract
        selector: '.tbl tbody tr td b'
        into: hotel_kw
        expect: 取首行酒店名作关键词
      - id: 搜索框填关键词
        as: admin
        type: fill
        selector: 'form[action="/hotels"] input[name="q"]'
        value: ${var:hotel_kw}
      - id: 回车隐式提交
        as: admin
        type: press
        key: Enter
        expect: 回车隐式提交
      - id: URL带q参数
        as: admin
        type: js_assert
        script: 'location.href'
        contains: "q="
        expect: URL 带 q 参数
      - id: 命中行名称均含关键词
        as: admin
        type: js_assert
        script: '(() => { const kw = "${var:hotel_kw}"; const rows = document.querySelectorAll(".tbl tbody tr"); return rows.length >= 1 && Array.from(rows).every((r) => ((r.querySelector("td b") || { textContent: "" }).textContent || "").includes(kw)); })()'
        truthy: true
        expect: 命中行名称均含关键词
      # ---------- H04 admin 标签筛选 ----------
      - id: 打开黑名单标签筛选
        as: admin
        type: navigate
        url: /hotels?shop_id=7&tag=黑名单酒店
      - id: 黑名单筛选命中行状态一致（或空态）
        as: admin
        type: js_assert
        script: '(() => { const chips = Array.from(document.querySelectorAll("a.chip.on")).filter((c) => c.textContent.includes("黑名单")); if (chips.length !== 1) return false; const wrap = (document.querySelector(".tblwrap") || { textContent: "" }).textContent; const rows = document.querySelectorAll(".tbl tbody tr"); if (wrap.includes("该店暂无酒店配置")) return rows.length === 1; return Array.from(rows).every((r) => { const sel = r.querySelector("select.m-sel[name=status_tag]"); return sel !== null && !sel.disabled && sel.value === "黑名单酒店"; }); })()'
        truthy: true
        expect: 黑名单筛选命中行状态一致（或空态）
  - id: 分页与计数自洽
    type: flow
    expect: 「共N家·第X/Y页」计数与分页条互洽
    steps:
      # ---------- H05 分页与计数自洽 ----------
      - id: 打开酒店分页
        as: admin
        type: navigate
        url: /hotels?shop_id=7
      - id: 「共N家·第X/Y页」与分页条互洽
        as: admin
        type: js_assert
        script: '(() => { const note = (Array.from(document.querySelectorAll("p.note")).map((e) => e.textContent.trim()).find((t) => t.startsWith("共"))) || ""; const m = note.match(/共\s*(\d+)\s*家/); const m2 = note.match(/第\s*(\d+)\s*\/\s*(\d+)\s*页/); if (m === null || m2 === null) return false; const total = Number(m[1]); const pages = Number(m2[2]); return Math.ceil(total / 20) === pages && (document.querySelector("nav.pager") !== null) === (total > 20); })()'
        truthy: true
        expect: 「共 N 家·第 X/Y 页」与分页条互洽
  - id: 创建E2E店并以其身份登录
    type: flow
    expect: E2E 店创建成功并记录 shop_id，E2E 店身份登录进入平台
    steps:
      # ---------- admin 创建 E2E 店 ----------
      - id: 建店-打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 新增本场景的E2E店
        as: admin
        type: click
        selector: '#btn-add-shop'
        waitFor: '#adddlg[open]'
        expect: 新增本场景的 E2E 店
      - id: 建店-填写店铺名
        as: admin
        type: fill
        selector: '#adddlg input[name="name"]'
        value: ${var:shopName}
      - id: 建店-填写店铺账号
        as: admin
        type: fill
        selector: '#adddlg input[name="username"]'
        value: ${var:shopUser}
      - id: 建店-保存
        as: admin
        type: click
        selector: '#adddlg button.btn'
      - id: E2E店创建成功
        as: admin
        type: dom_assert
        selector: '.content .flash'
        contains: 已创建
        expect: E2E 店创建成功
      - id: 记录E2E店id
        as: admin
        type: extract
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-edit'
        attr: data-shop
        jsonField: id
        into: shop_id
        expect: 记录 E2E 店 id
      # ---------- e2e 登录 ----------
      - id: 店铺账号打开登录页
        as: e2e
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: e2e
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: e2e
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: e2e
        type: click
        selector: 'form button[type="submit"]'
      - id: E2E店身份登录成功
        as: e2e
        type: wait
        selector: '.topbar .usermenu'
        expect: E2E 店身份登录成功
  - id: 弹窗新增酒店
    type: flow
    expect: 弹窗新增酒店后 flash 提示成功、行恰 1 条，并记录 toggle 地址
    steps:
      # ---------- H06 弹窗新增酒店 ----------
      - id: 打开酒店列表（新增前）
        as: e2e
        type: navigate
        url: /hotels
      - id: 打开新增酒店弹窗
        as: e2e
        type: click
        selector: '#btn-new'
        expect: 打开新增酒店弹窗
      - id: 填写酒店名称
        as: e2e
        type: fill
        selector: '#hoteldlg input[name="hotel_name"]'
        value: ${var:hotelName}
      - id: 填写飞猪SHID
        as: e2e
        type: fill
        selector: '#hoteldlg input[name="fliggy_shid"]'
        value: ${var:hotelShid}
      - id: 填写城市郑州
        as: e2e
        type: fill
        selector: '#hoteldlg input[name="city_name"]'
        value: 郑州
      - id: 保存新酒店
        as: e2e
        type: click
        selector: '#hoteldlg button[type="submit"]'
      - id: flash提示新增（或更新既有）
        as: e2e
        type: js_assert
        script: '(() => { const t = Array.from(document.querySelectorAll(".content .flash")).map((f) => f.textContent).join(""); return t.includes("已新增酒店") || t.includes("已更新既有酒店"); })()'
        truthy: true
        expect: flash 提示新增（或更新既有）
      - id: 新酒店行恰1条
        as: e2e
        type: dom_assert
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}"))'
        count: 1
        expect: 新酒店行恰 1 条
      - id: 记录酒店toggle地址
        as: e2e
        type: extract
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) form[action*="/toggle"]'
        attr: action
        into: hotel_action
        expect: 记录酒店 toggle 地址
  - id: 弹窗编辑酒店
    type: flow
    expect: 编辑弹窗预填当前值，改城市洛阳保存后行内回显
    steps:
      # ---------- H07 弹窗编辑酒店 ----------
      - id: 打开酒店列表（编辑前）
        as: e2e
        type: navigate
        url: /hotels
      - id: 打开编辑弹窗
        as: e2e
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) .btn-edit'
        expect: 打开编辑弹窗
      - id: 编辑弹窗预填当前值
        as: e2e
        type: dom_assert
        selector: '#hoteldlg input[name="hotel_name"]'
        value: ${var:hotelName}
        expect: 编辑弹窗预填当前值
      - id: 修改城市洛阳
        as: e2e
        type: fill
        selector: '#hoteldlg input[name="city_name"]'
        value: 洛阳
      - id: 保存编辑
        as: e2e
        type: click
        selector: '#hoteldlg button[type="submit"]'
      - id: flash提示已保存修改
        as: e2e
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存修改
        expect: flash 提示已保存修改
      - id: 行内城市更新为洛阳
        as: e2e
        type: dom_assert
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) td:first-child'
        contains: 洛阳
        expect: 行内城市更新为洛阳
  - id: 行内打标
    type: flow
    expect: 行内下拉选优质酒店即存，flash 提示已更新标签且落库回显
    steps:
      # ---------- H08 行内打标 ----------
      - id: 打开酒店列表（打标前）
        as: e2e
        type: navigate
        url: /hotels
      - id: 等列表加载（打标前）
        as: e2e
        type: wait
        selector: '.tbl tbody tr'
      - id: 行内状态下拉选优质酒店（onchange即存）
        as: e2e
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) select.m-sel[name="status_tag"]'
        value: 优质酒店
        expect: 行内状态下拉选优质酒店（onchange 即存）
      - id: 校验打标提示条
        as: e2e
        type: dom_assert
        selector: '.content .flash'
        contains: 已更新
      - id: flash提示已更新标签
        as: e2e
        type: dom_assert
        selector: '.content .flash'
        contains: 标签
        expect: flash 提示已更新标签
      - id: 标签落库回显
        as: e2e
        type: dom_assert
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) select.m-sel[name="status_tag"]'
        value: 优质酒店
        expect: 标签落库回显
  - id: 停用与再启用
    type: flow
    expect: 行内停用后按钮翻转为启用，再启用 flash 提示已启用
    steps:
      # ---------- H09 停用与再启用 ----------
      - id: 打开酒店列表（停用前）
        as: e2e
        type: navigate
        url: /hotels
      - id: 等列表加载（停用前）
        as: e2e
        type: wait
        selector: '.tbl tbody tr'
      - id: 行内停用（无confirm）
        as: e2e
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) button:has-text("停用")'
        expect: 行内停用（无 confirm）
      - id: flash提示已停用
        as: e2e
        type: dom_assert
        selector: '.content .flash'
        contains: 已停用
        expect: flash 提示已停用
      - id: 按钮翻转为启用
        as: e2e
        type: dom_assert
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) button:has-text("启用")'
        count: 1
        expect: 按钮翻转为启用
      - id: 点击启用恢复
        as: e2e
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:hotelName}")) button:has-text("启用")'
      - id: flash提示已启用
        as: e2e
        type: dom_assert
        selector: '.content .flash'
        contains: 已启用
        expect: flash 提示已启用
  - id: 导出CSV
    type: flow
    expect: 导出文件名 hotels_*.csv 且表头含酒店名称
    steps:
      # ---------- H10 导出 CSV ----------
      - id: 导出CSV文件名与表头
        as: e2e
        type: download
        click: 'a.chip[href*="/hotels/export"]'
        namePrefix: hotels_
        nameSuffix: .csv
        headerContains: 酒店名称
        expect: 导出 CSV 文件名与表头
  - id: 已知缺陷证据与店侧安全边界
    type: flow
    expect: admin 新增点击成功留缺陷证据、e2e 店侧只见本店数据；越权接口 404、非法标签 302 报 danger
    steps:
      # ---------- H11 新增弹窗（已知 bug，缺陷证据） ----------
      - id: 打开新增弹窗（已知缺陷）
        as: admin
        type: navigate
        url: /hotels?shop_id=7
      - id: 点击新增（list.html残留代码致脚本语法错误）
        as: admin
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
        timeoutMs: 3000
        expect: 点击新增（list.html 残留代码致脚本语法错误）
      - id: 打开酒店列表（切店前）
        as: e2e
        type: navigate
        url: /hotels
      - id: 店铺下拉为空壳（无选项）
        as: e2e
        type: js_assert
        script: 'document.querySelectorAll("select[name=shop_id] option").length'
        equals: 0
        expect: 店铺下拉为空壳（无选项）
      - id: 只看到本店酒店行
        as: e2e
        type: dom_assert
        selector: '.tbl tbody tr'
        countAtLeast: 1
        expect: 只看到本店酒店行
      - id: 非空态
        as: e2e
        type: js_assert
        script: '!(document.querySelector(".tblwrap") || { textContent: "" }).textContent.includes("该店暂无酒店配置")'
        truthy: true
        expect: 非空态
      # ---------- HS02 跨店 404 ----------
      - id: 越权编辑页404
        as: e2e
        type: http
        method: GET
        path: /hotels/1/edit
        expectStatus: 404
        expect: 越权编辑页 404
      - id: 越权更新接口404
        as: e2e
        type: http
        method: POST
        path: /hotels/1/update
        form:
          hotel_name: hacked
          fliggy_shid: x
        expectStatus: 404
        expect: 越权更新接口 404
      # ---------- HS03 打标非法值 ----------
      - id: 非法标签302重定向
        as: e2e
        type: http
        method: POST
        path: /hotels/tag
        form:
          shop_id: ${var:shop_id}
          fliggy_shid: ${var:hotelShid}
          back: board
          status_tag: 垃圾值
        maxRedirects: 0
        expectStatus: 302
        expect: 非法标签 302 重定向
      - id: 打开酒店列表（切店后）
        as: e2e
        type: navigate
        url: /hotels
      - id: flash提示非法标签
        as: e2e
        type: dom_assert
        selector: '.content .flash'
        contains: 非法status_tag
        expect: flash 提示非法标签
      - id: 错误级别danger
        as: e2e
        type: dom_assert
        selector: '.content .flash.danger'
        state: visible
        expect: 错误级别 danger
teardown:
  - id: 收尾登录并停用E2E店留档
    type: flow
    expect: admin 重新登录，若 E2E 店仍在营则停用留档
    steps:
      - id: 收尾打开登录页
        as: admin
        type: navigate
        url: /login
      - id: 收尾填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: 收尾填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: 收尾提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: 收尾等登录完成
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 收尾打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 收尾等列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 停用E2E店留档（仅当仍在营）
        as: admin
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
        when: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); return ((row || {}).querySelector ? (row.querySelector(".pill") || { textContent: "" }).textContent : "").trim() === "在营"; })()'
        onFail: warn
        expect: 停用 E2E 店留档（仅当仍在营）
