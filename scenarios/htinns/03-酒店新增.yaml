# 场景三 v3：酒店新增（信科同步回填）—— 数据纪律：复用固定夹具店，不新增店铺
# 夹具店 E2E-酒店-1105-160709（shop_id=124，初始密码 123456），收尾用删除功能清掉测试酒店
# 链路：基线登录 → 配信科凭证（XK_COOKIE / 平台ID 499，与凭证账号配对）→
#       弹窗新增酒店（名称取环境变量 HOTEL_NAME，信科平台真实在线酒店）→
#       点信科同步 → 断言字段回填 → 保存 → 再来一遍验证 upsert 幂等 → 收尾自删
# 拍图口径：同步环节与保存环节分开，使「弹窗回填画面」成为同步环节的结束帧
name: 酒店新增与信科同步
description: 对应用户场景 3；验证新增酒店弹窗的信科同步回填与 upsert 幂等（复用夹具店，收尾自动清理）
version: 3
trace: false
requires:
  env: [XK_COOKIE, HOTEL_NAME]
variables:
  shopUser: "e2ehtl_20261105160709"
actors:
  shop:
    description: 夹具店铺身份（E2E-酒店-1105-160709）
    dialogs: accept
steps:
  - id: 店侧基线登录
    type: flow
    expect: 夹具店账号可正常登录（基线）
    steps:
      - id: 店铺账号打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 基线登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
  - id: 店侧配置信科凭证
    type: flow
    expect: 本店信科平台ID（499，与凭证账号配对）与Cookie（环境变量 XK_COOKIE）保存成功
    steps:
      - id: 打开店铺配置页
        as: shop
        type: navigate
        url: /settings/shop
      - id: 等本店行加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 打开本店编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-edit'
        waitFor: '#editdlg[open]'
      - id: 填写信科店铺ID
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_shop_id"]'
        value: "499"
      - id: 填写真实Cookie
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_cookie"]'
        value: ${var:XK_COOKIE}
      - id: 保存凭证
        as: shop
        type: click
        selector: '#editdlg button.btn'
      - id: flash提示已保存
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存
  - id: 新增酒店并信科同步
    type: flow
    expect: 名称取 HOTEL_NAME，点信科同步后字段全部回填（环节结束帧=弹窗回填画面）
    steps:
      - id: 打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 点击新增酒店
        as: shop
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
      - id: 填写测试酒店名
        as: shop
        type: fill
        selector: '#hotelform input[name="hotel_name"]'
        value: ${var:HOTEL_NAME}
      - id: 点击信科同步
        as: shop
        type: click
        selector: '#btn-xinke'
      - id: 同步成功提示出现
        as: shop
        type: js_assert
        script: 'document.getElementById("sync-msg").textContent'
        contains: 信科同步成功
        expect: 信科同步成功，记得保存
      - id: 同步字段已回填
        as: shop
        type: js_assert
        script: '(() => { const f = (n) => (document.querySelector("#hotelform input[name=" + JSON.stringify(n) + "]") || { value: "" }).value.trim(); return f("supplier_hotel_id") !== "" && f("supplier") !== "" && f("city_name") !== ""; })()'
        truthy: true
        expect: 供应商酒店ID/供应商/城市已自动回填
      - id: 飞猪映射已补全
        as: shop
        type: js_assert
        script: '(() => { const f = (n) => (document.querySelector("#hotelform input[name=" + JSON.stringify(n) + "]") || { value: "" }).value.trim(); return f("fliggy_shid") !== "" && f("fliggy_hid") !== ""; })()'
        truthy: true
        expect: 飞猪 SHID/HID 经平台映射补全（shopid=499 配对正确时应非空）
  - id: 保存新增酒店
    type: flow
    expect: 保存成功（新增或 upsert 更新均认可），列表出现该酒店且恰 1 行
    steps:
      - id: 点击保存
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: flash提示保存成功
        as: shop
        type: js_assert
        script: '/(已新增酒店|已更新既有酒店)/.test((document.querySelector(".content .flash") || { textContent: "" }).textContent)'
        truthy: true
        expect: 保存成功（首次新增；若上次收尾失败有残留则 upsert 更新，均认可）
      - id: 列表恰有1行该酒店
        as: shop
        type: js_assert
        script: '(() => { const name = "${var:HOTEL_NAME}"; return Array.from(document.querySelectorAll(".tbl tbody tr")).filter((tr) => tr.textContent.includes(name)).length === 1; })()'
        truthy: true
        expect: 列表出现该酒店且仅 1 行
  - id: 重复打开并再次同步
    type: flow
    expect: 同名再次信科同步成功（环节结束帧=二次弹窗画面）
    steps:
      - id: 再次点击新增酒店
        as: shop
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
      - id: 再次填写同名
        as: shop
        type: fill
        selector: '#hotelform input[name="hotel_name"]'
        value: ${var:HOTEL_NAME}
      - id: 再次点击信科同步
        as: shop
        type: click
        selector: '#btn-xinke'
      - id: 二次同步成功提示
        as: shop
        type: js_assert
        script: 'document.getElementById("sync-msg").textContent'
        contains: 信科同步成功
  - id: 重复保存走upsert更新
    type: flow
    expect: 同名再添加不报错不产生重复行，保存提示「已更新既有酒店」
    steps:
      - id: 点击保存2
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: flash提示已更新既有酒店
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已更新既有酒店
        expect: upsert 命中既有记录提示已更新
      - id: 列表仍恰1行不重复
        as: shop
        type: js_assert
        script: '(() => { const name = "${var:HOTEL_NAME}"; return Array.from(document.querySelectorAll(".tbl tbody tr")).filter((tr) => tr.textContent.includes(name)).length === 1; })()'
        truthy: true
        expect: 重复添加后仍只有 1 行（幂等）
teardown:
  - id: 收尾删除夹具酒店
    type: flow
    expect: 用删除功能清掉测试酒店，跑完店铺酒店列表为空（不残留数据）
    steps:
      - id: 收尾打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 收尾等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 删除夹具酒店
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:HOTEL_NAME}")) .btn-del'
        when: '(() => { const name = "${var:HOTEL_NAME}"; return Array.from(document.querySelectorAll(".tbl tbody tr")).some((tr) => tr.textContent.includes(name)); })()'
        waitFor: '.content .flash'
      - id: 列表无残留夹具
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 15000
        script: '!Array.from(document.querySelectorAll(".tbl tbody tr")).some((tr) => tr.textContent.includes("${var:HOTEL_NAME}"))'
        truthy: true
        expect: 收尾后列表不含测试酒店（下次运行从空店重建）
