# 场景一：店铺配置页 /settings/shop（迁移自 htinns-test e2e/test_01_shop.py）
# 主线：admin 登录→新增 E2E 店→写凭证→启停→信科提醒→搜索→权限边界→退出
# 硬规则：写操作只落 E2E- 前缀店铺；真实店（新乡旅途）只读登录走查
name: 店铺配置
description: 主流程 + 旁路（权限边界 / 校验报错 / 非 admin 视角 / 提醒关闭），对应用例 M01-M11、S01-S10
version: 1
requires:
  env: []
variables:
  shopName: "E2E-迁移店-${var:RUN_STAMP}"
  shopUser: "e2e_mig_${var:RUN_DATE}${var:RUN_TIME}"
actors:
  admin:
    description: 管理员（全程自动接受原生 confirm）
    dialogs: accept
  shop:
    description: 新乡旅途店侧账号（只读真实店）
    dialogs: accept
guards:
  blockedRoutes:
    - "*/maintain/push/run"
steps:
  # ---------- M01 登录平台 ----------
  - id: 打开登录页
    as: admin
    type: navigate
    url: /login
    expect: 打开登录页
  - id: 管理员填写账号
    as: admin
    type: fill
    selector: 'input[name="username"]'
    value: ${var:ADMIN_USER}
  - id: 管理员填写密码
    as: admin
    type: fill
    selector: 'input[name="password"]'
    value: ${var:ADMIN_PW}
  - id: 管理员提交登录
    as: admin
    type: click
    selector: 'form button[type="submit"]'
  - id: 登录成功进平台
    as: admin
    type: wait
    selector: '.topbar .usermenu'
    expect: 登录成功进平台
  # ---------- M02 查看全部店铺 ----------
  - id: 打开店铺配置页
    as: admin
    type: navigate
    url: /settings/shop
    expect: 打开店铺配置页
  - id: admin可见「增加店铺」入口
    as: admin
    type: dom_assert
    selector: '#btn-add-shop'
    state: visible
    expect: admin 可见「增加店铺」入口
  - id: 列表展示全部店铺（含停用）至少2行
    as: admin
    type: dom_assert
    selector: '.tblwrap table.tbl tbody tr'
    countAtLeast: 2
    expect: 列表展示全部店铺（含停用）至少 2 行
  # ---------- M03 新增店铺 ----------
  - id: 打开新增店铺弹窗
    as: admin
    type: click
    selector: '#btn-add-shop'
    waitFor: '#adddlg[open]'
    expect: 打开新增店铺弹窗
  - id: 填写店铺名
    as: admin
    type: fill
    selector: '#adddlg input[name="name"]'
    value: ${var:shopName}
  - id: 填写店铺账号
    as: admin
    type: fill
    selector: '#adddlg input[name="username"]'
    value: ${var:shopUser}
  - id: 保存新店铺
    as: admin
    type: click
    selector: '#adddlg button.btn'
  - id: flash提示已创建
    as: admin
    type: dom_assert
    selector: '.content .flash'
    contains: 已创建
    expect: flash 提示已创建
  - id: 新店行恰1条
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}"))'
    count: 1
    expect: 新店行恰 1 条
  - id: 新店状态在营
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .pill'
    text: 在营
    expect: 新店状态在营
  # ---------- M04 为新店填写凭证 ----------
  - id: 打开E2E店编辑弹窗
    as: admin
    type: click
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-edit'
    waitFor: '#editdlg[open]'
    expect: 打开 E2E 店编辑弹窗
  - id: 填写信科店铺ID
    as: admin
    type: fill
    selector: '#editdlg input[name="xk_shop_id"]'
    value: E2E9999
  - id: 填写无效信科Cookie
    as: admin
    type: fill
    selector: '#editdlg input[name="xk_cookie"]'
    value: E2E-invalid-cookie-for-alert-test
  - id: 保存信科配置
    as: admin
    type: click
    selector: '#editdlg button.btn'
  - id: 部分更新只保存填了的2个字段
    as: admin
    type: dom_assert
    selector: '.content .flash'
    contains: 已保存 2 个字段
    expect: 部分更新只保存填了的 2 个字段
  # ---------- M05 保存后凭证回显 ----------
  - id: 平台ID明文回显
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) td.num'
    contains: E2E9999
    expect: 平台 ID 明文回显
  - id: Cookie列掩码回显
    as: admin
    type: js_assert
    script: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); if (!row) return false; return ((row.querySelectorAll("td.num")[1] || { textContent: "" }).textContent || "").trim().startsWith("****"); })()'
    truthy: true
    expect: Cookie 列掩码回显
  # ---------- M06 编辑弹窗不回显旧值 ----------
  - id: 再开编辑弹窗
    as: admin
    type: click
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-edit'
    waitFor: '#editdlg[open]'
    expect: 再开编辑弹窗
  - id: 5个凭证输入框全部为空（留空=不修改）
    as: admin
    type: js_assert
    script: '(() => { const els = document.querySelectorAll(''#editdlg input[type=text]:not([name=shop_id])''); return els.length === 5 && Array.from(els).every((i) => i.value === ""); })()'
    truthy: true
    expect: 5 个凭证输入框全部为空（留空=不修改）
  - id: 关闭编辑弹窗
    as: admin
    type: click
    selector: '#dlg-close'
  # ---------- M07 停用店铺 ----------
  - id: 行内停用（原生confirm自动接受）
    as: admin
    type: click
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
    expect: 行内停用（原生 confirm 自动接受）
  - id: flash提示已停用
    as: admin
    type: dom_assert
    selector: '.content .flash'
    contains: 已停用
    expect: flash 提示已停用
  - id: 行状态翻转为停用
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .pill'
    text: 停用
    expect: 行状态翻转为停用
  # ---------- M08 启用店铺 ----------
  - id: 再启用
    as: admin
    type: click
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
    expect: 再启用
  - id: flash提示已启用
    as: admin
    type: dom_assert
    selector: '.content .flash'
    contains: 已启用
    expect: flash 提示已启用
  - id: 行状态回到在营
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .pill'
    text: 在营
    expect: 行状态回到在营
  # ---------- M09 信科凭证失效提醒 ----------
  - id: 顶栏警示徽标亮起
    as: admin
    type: wait
    selector: '#ckalert:not([hidden])'
    timeoutMs: 20000
    expect: 顶栏警示徽标亮起
  - id: 失效店数>=1
    as: admin
    type: js_assert
    script: 'Number(document.querySelector(''#ckalert-n'').textContent) >= 1'
    truthy: true
    expect: 失效店数 >= 1
  - id: 点击凭证提醒徽标
    as: admin
    type: click
    selector: '#ckalert-chip'
  - id: 浮层列出失效店铺
    as: admin
    type: dom_assert
    selector: '#ckalert-pop'
    contains: ${var:shopName}
    expect: 浮层列出失效店铺
  - id: 浮层有去配置更新入口
    as: admin
    type: dom_assert
    selector: '#ckalert-pop'
    contains: 去店铺配置更新
    expect: 浮层有去配置更新入口
  - id: 可重新检测
    as: admin
    type: click
    selector: '#ckalert-recheck'
    expect: 可重新检测
  - id: 等提醒弹出
    as: admin
    type: wait
    ms: 500
  # ---------- M11 搜索店铺 ----------
  - id: 搜索前列表
    as: admin
    type: navigate
    url: /settings/shop
    expect: 搜索前列表
  - id: 搜索框填店铺名
    as: admin
    type: fill
    selector: '.controls form[action="/settings/shop"] input[name="q"]'
    value: ${var:shopName}
  - id: 执行搜索
    as: admin
    type: click
    selector: '.controls form[action="/settings/shop"] button'
  - id: 等搜索结果表格
    as: admin
    type: wait
    selector: '.tblwrap table.tbl'
  - id: 全名精确命中恰1行
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr'
    count: 1
    expect: 全名精确命中恰 1 行
  - id: 搜索框保留完整关键词
    as: admin
    type: js_assert
    script: '(document.querySelector(''.controls form[action="/settings/shop"] input[name="q"]'') || {value: ""}).value'
    equals: ${var:shopName}
    expect: 搜索框保留完整关键词
  # ---------- S06 新增必填校验 ----------
  - id: 打开店铺配置页（必填校验）
    as: admin
    type: navigate
    url: /settings/shop
  - id: 点击增加店铺
    as: admin
    type: click
    selector: '#btn-add-shop'
    waitFor: '#adddlg[open]'
  - id: 留空提交
    as: admin
    type: click
    selector: '#adddlg button.btn'
    expect: 留空提交
  - id: HTML5必填拦截
    as: admin
    type: js_assert
    script: '!document.querySelector(''#adddlg input[name="name"]'').validity.valid'
    truthy: true
    expect: HTML5 必填拦截
  - id: 弹窗不关、不跳转
    as: admin
    type: js_assert
    script: 'document.querySelector(''#adddlg'').open'
    truthy: true
    expect: 弹窗不关、不跳转
  # ---------- S07 重复用户名报错 ----------
  - id: 关掉S06残留的新增弹窗
    as: admin
    type: click
    selector: '#adddlg #add-close'
    expect: 关掉 S06 残留的新增弹窗
  - id: 点击增加店铺（重名）
    as: admin
    type: click
    selector: '#btn-add-shop'
    waitFor: '#adddlg[open]'
  - id: 填写重名店铺名
    as: admin
    type: fill
    selector: '#adddlg input[name="name"]'
    value: ${var:shopName}-重名
  - id: 重名-填写店铺账号
    as: admin
    type: fill
    selector: '#adddlg input[name="username"]'
    value: ${var:shopUser}
  - id: 提交重复用户名
    as: admin
    type: click
    selector: '#adddlg button.btn'
    expect: 提交重复用户名
  - id: flash提示创建失败
    as: admin
    type: dom_assert
    selector: '.content .flash'
    contains: 创建失败
    expect: flash 提示创建失败
  - id: 错误级别danger
    as: admin
    type: dom_assert
    selector: '.content .flash.danger'
    state: visible
    expect: 错误级别 danger
  # ---------- S08 管理员账户不可停用 ----------
  - id: id=1行无停用按钮
    as: admin
    type: dom_assert
    selector: '.tbl tbody tr:has(td b:text-is("管理员")) .btn-toggle'
    count: 0
    expect: id=1 行无停用按钮
  - id: 直接POST停管理员→403
    as: admin
    type: http
    method: POST
    path: /settings/shop/toggle
    form:
      shop_id: "1"
    expectStatus: 403
    expect: 直接 POST 停管理员 → 403
  # ---------- S09 凭证提醒本次不再显示 ----------
  - id: 等提醒再次出现
    as: admin
    type: wait
    selector: '#ckalert:not([hidden])'
    timeoutMs: 20000
  - id: 点击不再显示
    as: admin
    type: click
    selector: '#ckalert-chip'
  - id: 等不再显示弹层
    as: admin
    type: wait
    selector: '#ckalert-pop:not([hidden])'
  - id: 本次不再显示
    as: admin
    type: click
    selector: '#ckalert-dismiss'
    expect: 本次不再显示
  - id: 写入sessionStorage
    as: admin
    type: js_assert
    script: 'sessionStorage.getItem(''ckalert-dismissed'')'
    equals: "1"
    expect: 写入 sessionStorage
  - id: 刷新页面
    as: admin
    type: navigate
    url: /settings/shop
    expect: 刷新页面
  - id: 等列表加载
    as: admin
    type: wait
    selector: '.tblwrap table.tbl'
  - id: 探测完成（计数非0）
    as: admin
    type: js_assert
    script: 'document.getElementById(''ckalert-n'') !== null && document.getElementById(''ckalert-n'').textContent !== ''0'''
    truthy: true
    timeoutMs: 30000
    expect: 探测完成（计数非 0）
  - id: 刷新后徽标保持隐藏
    as: admin
    type: dom_assert
    selector: '#ckalert'
    state: hidden
    expect: 刷新后徽标保持隐藏
  # ---------- M10 退出登录 ----------
  - id: 等顶栏布局稳定
    as: admin
    type: wait
    ms: 1000
    expect: 等顶栏布局稳定
  - id: 悬停展开用户菜单
    as: admin
    type: hover
    selector: '.topbar .usermenu'
    expect: 悬停展开用户菜单
  - id: 退出登录
    as: admin
    type: click
    selector: '.udrop a[href="/logout"]'
  - id: 等回到登录页
    as: admin
    type: wait
    selector: '.loginbody'
  - id: 回到登录页
    as: admin
    type: js_assert
    script: 'location.pathname'
    contains: /login
    expect: 回到登录页
  # ---------- 店侧：S01-S05、S10 ----------
  - id: 店铺账号打开登录页
    as: shop
    type: navigate
    url: /login
  - id: 店铺账号填写用户名
    as: shop
    type: fill
    selector: 'input[name="username"]'
    value: ${var:SHOP_USER}
  - id: 店铺账号填写密码
    as: shop
    type: fill
    selector: 'input[name="password"]'
    value: ${var:SHOP_PW}
  - id: 店铺账号提交登录
    as: shop
    type: click
    selector: 'form button[type="submit"]'
  - id: 店侧登录成功
    as: shop
    type: wait
    selector: '.topbar .usermenu'
    expect: 店侧登录成功
  - id: 店铺账号打开店铺配置页
    as: shop
    type: navigate
    url: /settings/shop
  - id: 非admin恰1行（本店）
    as: shop
    type: dom_assert
    selector: '.tbl tbody tr'
    count: 1
    expect: 非 admin 恰 1 行（本店）
  - id: 无「增加店铺」按钮
    as: shop
    type: dom_assert
    selector: '#btn-add-shop'
    count: 0
    expect: 无「增加店铺」按钮
  - id: 本店行有编辑入口
    as: shop
    type: dom_assert
    selector: '.tbl tbody tr .btn-edit'
    count: 1
    expect: 本店行有编辑入口
  - id: 凭证列全掩码，页面无明文
    as: shop
    type: js_assert
    script: '(() => { const ok = (v) => v === "（未设置）" || /^\*\*\*\*.{0,8}$/.test(v); return Array.from(document.querySelectorAll(''.tbl tbody tr'')).every((tr) => ok((tr.querySelector("td:nth-child(3)")?.textContent || "").trim()) && ok((tr.querySelector("td:nth-child(4)")?.textContent || "").trim())); })()'
    truthy: true
    expect: 凭证列全掩码，页面无明文
  - id: 打开本店编辑弹窗
    as: shop
    type: click
    selector: '.tbl tbody tr:has(td b:text-is("${var:SHOP_USER}")) .btn-edit'
    waitFor: '#editdlg[open]'
    expect: 打开本店编辑弹窗
  - id: 弹窗预填恒空
    as: shop
    type: js_assert
    script: '(() => { const els = document.querySelectorAll(''#editdlg input[type=text]:not([name=shop_id])''); return els.length === 5 && Array.from(els).every((i) => i.value === ""); })()'
    truthy: true
    expect: 弹窗预填恒空
  - id: 全空保存
    as: shop
    type: click
    selector: '#editdlg button.btn'
    expect: 全空保存
  - id: 留空保存提示
    as: shop
    type: dom_assert
    selector: '.content .flash'
    contains: 没有填写任何要修改的字段
    expect: 留空保存提示
  - id: 提示级别warning
    as: shop
    type: dom_assert
    selector: '.content .flash.warning'
    state: visible
    expect: 提示级别 warning
  - id: 非admin创建接口403
    as: shop
    type: http
    method: POST
    path: /settings/shop/create
    form:
      name: x
      username: x
    expectStatus: 403
    expect: 非 admin 创建接口 403
  - id: 非admin停用接口403
    as: shop
    type: http
    method: POST
    path: /settings/shop/toggle
    form:
      shop_id: "2"
    expectStatus: 403
    expect: 非 admin 停用接口 403
  - id: 页面行数不变
    as: shop
    type: dom_assert
    selector: '.tbl tbody tr'
    count: 1
    expect: 页面行数不变
  - id: 非admin无搜索框
    as: shop
    type: dom_assert
    selector: 'form[action="/settings/shop"] input[name="q"]'
    count: 0
    expect: 非 admin 无搜索框
  - id: 非admin无分页条
    as: shop
    type: dom_assert
    selector: 'nav.pager'
    count: 0
    expect: 非 admin 无分页条
teardown:
  # 收尾：admin 重新登录，若 E2E 店还在营则停用留档（common 无删除接口）
  - id: 收尾打开登录页
    as: admin
    type: navigate
    url: /login
  - id: 收尾填写账号
    as: admin
    type: fill
    selector: 'input[name="username"]'
    value: ${var:ADMIN_USER}
  - id: 收尾填写密码
    as: admin
    type: fill
    selector: 'input[name="password"]'
    value: ${var:ADMIN_PW}
  - id: 收尾提交登录
    as: admin
    type: click
    selector: 'form button[type="submit"]'
  - id: 收尾等登录完成
    as: admin
    type: wait
    selector: '.topbar .usermenu'
  - id: 收尾打开店铺配置页
    as: admin
    type: navigate
    url: /settings/shop
  - id: 收尾等列表加载
    as: admin
    type: wait
    selector: '.tblwrap table.tbl'
  - id: 停用E2E店留档（仅当仍在营）
    as: admin
    type: click
    selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
    when: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); return ((row || {}).querySelector ? (row.querySelector(".pill") || { textContent: "" }).textContent : "").trim() === "在营"; })()'
    onFail: warn
    expect: 停用 E2E 店留档（仅当仍在营）
