# 场景一：信科Cookie有效性闭环（建店 → 店侧登录 → 无效告警 → 换有效Cookie → 告警解除）
# 硬规则：写操作只落 E2E- 前缀店铺；依赖环境变量 XK_COOKIE（真实有效信科Cookie，secret）
module: 店铺管理
name: 信科Cookie闭环
description: 建店→店侧登录→无效凭证告警→换环境变量Cookie→验证生效，对应 Cookie 有效性闭环
version: 2
requires:
  env: [XK_COOKIE]
variables:
  shopName: "E2E-cookie-${var:RUN_STAMP}"
  shopUser: "e2eck_${var:RUN_DATE}${var:RUN_TIME}"
actors:
  admin:
    description: 管理员（自动接受原生 confirm）
    dialogs: accept
  shop:
    description: 新建E2E店的店侧账号（默认密码123456）
    dialogs: accept
guards:
  blockedRoutes:
    - "*/maintain/push/run"
steps:
  - id: 管理员登录
    type: flow
    expect: 登录成功进入平台
    steps:
      - id: 打开登录页
        as: admin
        type: navigate
        url: /login
        expect: 打开登录页
      - id: 填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: 填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: 提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: 登录成功进平台
        as: admin
        type: wait
        selector: '.topbar .usermenu'
        expect: 登录成功进平台
  - id: 新增E2E店铺
    type: flow
    expect: 随机店名建店成功，flash已创建、行状态在营（密码留空走默认123456）
    steps:
      - id: 打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
        expect: 打开店铺配置页
      - id: 打开新增店铺弹窗
        as: admin
        type: click
        selector: '#btn-add-shop'
        waitFor: '#adddlg[open]'
        expect: 打开新增店铺弹窗
      - id: 填写店铺名
        as: admin
        type: fill
        selector: '#adddlg input[name="name"]'
        value: ${var:shopName}
      - id: 填写登录用户名
        as: admin
        type: fill
        selector: '#adddlg input[name="username"]'
        value: ${var:shopUser}
      - id: 保存新店铺
        as: admin
        type: click
        selector: '#adddlg button.btn'
        expect: 提交创建（初始密码留空=123456）
      - id: flash提示已创建
        as: admin
        type: dom_assert
        selector: '.content .flash'
        contains: 已创建
        expect: flash 提示已创建
      - id: 新店行恰1条
        as: admin
        type: dom_assert
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}"))'
        count: 1
        expect: 新店行恰 1 条
      - id: 新店状态在营
        as: admin
        type: dom_assert
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .pill'
        text: 在营
        expect: 新店状态在营
  - id: 登录新店铺
    type: flow
    expect: 店侧账号+默认密码登录成功，恰1行本店
    steps:
      - id: 店侧打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店侧填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店侧填写默认密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店侧提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 店侧登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
        expect: 店侧登录成功（默认密码123456可用）
      - id: 打开本店配置页
        as: shop
        type: navigate
        url: /settings/shop
      - id: 非admin恰1行本店
        as: shop
        type: dom_assert
        selector: '.tbl tbody tr'
        count: 1
        expect: 非 admin 恰 1 行（本店）
  - id: 无效信科凭证告警
    type: flow
    expect: 填入假Cookie保存成功；探测判定无效，徽标亮起且浮层列出本店（Cookie已过期）
    steps:
      - id: 打开本店编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-edit'
        waitFor: '#editdlg[open]'
        expect: 打开 E2E 店编辑弹窗
      - id: 填写信科店铺ID
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_shop_id"]'
        value: E2E9999
      - id: 填写无效Cookie
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_cookie"]'
        value: E2E-invalid-cookie-for-loop-test
      - id: 保存凭证
        as: shop
        type: click
        selector: '#editdlg button.btn'
      - id: flash提示已保存2个字段
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存 2 个字段
        expect: 部分更新只保存填了的 2 个字段
      - id: 探测接口判定本店无效
        as: shop
        type: js_assert
        script: '(async () => { const j = await (await fetch("/api/xinke/check_cookie")).json(); return j.code === 0 && j.data.valid === false && j.data.invalid.some((x) => x.name === "${var:shopName}" && /过期/.test(x.message)); })()'
        truthy: true
        timeoutMs: 30000
        expect: check_cookie 返回 invalid 且包含本店、消息含「过期」
      - id: 顶栏警示徽标亮起
        as: shop
        type: wait
        selector: '#ckalert:not([hidden])'
        timeoutMs: 30000
        expect: 店侧顶栏徽标亮起（轮询探测到本店失效）
      - id: 浮层列出本店
        as: shop
        type: js_assert
        script: '(async () => { document.querySelector(''#ckalert-chip'').click(); await new Promise((r) => setTimeout(r, 300)); const pop = document.querySelector(''#ckalert-pop''); return pop && !pop.hidden && pop.textContent.includes("${var:shopName}"); })()'
        truthy: true
        timeoutMs: 15000
        expect: 点开浮层列出本店
  - id: 输入环境变量Cookie
    type: flow
    expect: 把Cookie换成XK_COOKIE里的真实值，只保存这1个字段
    steps:
      - id: 再开编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-edit'
        waitFor: '#editdlg[open]'
        expect: 再开编辑弹窗（预填恒空）
      - id: 填写有效Cookie
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_cookie"]'
        value: ${var:XK_COOKIE}
      - id: 保存有效Cookie
        as: shop
        type: click
        selector: '#editdlg button.btn'
      - id: flash提示已保存1个字段
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存 1 个字段
        expect: 只更新 Cookie 这 1 个字段（留空=不修改）
  - id: 验证凭证生效
    type: flow
    expect: 探测返回有效且失效列表不含本店；徽标熄灭
    steps:
      - id: 探测接口判定本店有效
        as: shop
        type: js_assert
        script: '(async () => { const j = await (await fetch("/api/xinke/check_cookie")).json(); return j.code === 0 && j.data.valid === true && !j.data.invalid.some((x) => x.name === "${var:shopName}"); })()'
        truthy: true
        timeoutMs: 30000
        expect: check_cookie 返回 valid 且失效列表不含本店
      - id: 徽标熄灭
        as: shop
        type: js_assert
        script: 'document.getElementById("ckalert") === null || document.getElementById("ckalert").hidden === true'
        truthy: true
        timeoutMs: 30000
        expect: 店侧顶栏徽标在轮询后保持隐藏
teardown:
  - id: 收尾登录并停用E2E店留档
    type: flow
    expect: 若E2E店仍在营则停用留档
    steps:
      - id: 收尾打开登录页
        as: admin
        type: navigate
        url: /login
      - id: 收尾填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: 收尾填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: 收尾提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: 收尾等登录完成
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 收尾打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 收尾等列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 停用E2E店留档（仅当仍在营）
        as: admin
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
        when: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); return ((row || {}).querySelector ? (row.querySelector(".pill") || { textContent: "" }).textContent : "").trim() === "在营"; })()'
        onFail: warn
        expect: 停用 E2E 店留档（仅当仍在营）
