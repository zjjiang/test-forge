# 场景四：观测看板 /observe、/diagnosis（迁移自 htinns-test e2e/test_04_observe.py）
# 全页 GET 只读。主线：admin 缺省重定向、整店概要、酒店下钻、orders/price 两模式
# 旁路：非 admin 锁本店（shop_id 参数无效）；OS02 为已知缺陷证据（onFail warn）
name: 观测看板
description: 对应用例 O01-O05、OS01-OS02；OS02 为已知缺陷的证据（onFail warn）
version: 1
requires:
  env: []
variables:
  shopName: "E2E-观测迁移店-${var:RUN_STAMP}"
  shopUser: "e2e_mig4_${var:RUN_DATE}${var:RUN_TIME}"
actors:
  admin:
    description: 管理员
    dialogs: accept
  e2e:
    description: E2E 测试店铺身份（旁路用例）
    dialogs: accept
guards:
  blockedRoutes:
    - "*/maintain/push/run"
steps:
  - id: 管理员登录平台
    type: flow
    expect: admin 登录成功进入平台
    steps:
      # ---------- admin 登录 ----------
      - id: 管理员打开登录页
        as: admin
        type: navigate
        url: /login
      - id: 管理员填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: 管理员填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: 管理员提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: admin登录成功
        as: admin
        type: wait
        selector: '.topbar .usermenu'
        expect: admin 登录成功

  - id: 缺省重定向诊断页
    type: flow
    expect: 裸访问 /observe 302 到 /diagnosis，诊断条件表单齐备
    steps:
      # ---------- O01 缺省重定向 ----------
      - id: 裸访问/observe（应302到/diagnosis）
        as: admin
        type: navigate
        url: /observe
        expect: 裸访问 /observe（应 302 到 /diagnosis）
      - id: 重定向到单店诊断
        as: admin
        type: js_assert
        script: 'location.pathname'
        contains: /diagnosis
        expect: 重定向到单店诊断
      - id: 诊断条件表单：店铺下拉
        as: admin
        type: dom_assert
        selector: 'select[name="shop_id"]'
        state: visible
        expect: 诊断条件表单：店铺下拉
      - id: 诊断条件表单：酒店输入
        as: admin
        type: dom_assert
        selector: 'input[name="hotel_name"]'
        state: visible
        expect: 诊断条件表单：酒店输入
      - id: 诊断条件表单：日期
        as: admin
        type: dom_assert
        selector: 'input[name="date_from"]'
        state: visible
        expect: 诊断条件表单：日期
      - id: 页面含诊断条件
        as: admin
        type: js_assert
        script: '(document.querySelector("main.content") || { textContent: "" }).textContent.includes("诊断条件")'
        truthy: true
        expect: 页面含诊断条件

  - id: 整店诊断概要与下钻
    type: flow
    expect: 真实店概要酒店提示≤50、链接非空，下钻后名称回显且含表格组
    steps:
      # ---------- O02 整店诊断概要 ----------
      - id: 指定真实店（只读）
        as: admin
        type: navigate
        url: /diagnosis?shop_id=7
        expect: 指定真实店（只读）
      - id: 等看板内容加载
        as: admin
        type: wait
        selector: '.content'
      - id: 酒店提示≤50条（设计：只给前50）
        as: admin
        type: js_assert
        script: 'document.querySelectorAll("#hotel-hint option").length <= 50'
        truthy: true
        expect: 酒店提示 ≤ 50 条（设计：只给前 50）
      - id: 概要行酒店名链接非空
        as: admin
        type: js_assert
        script: 'Array.from(document.querySelectorAll(".tbl a[href*=\"hotel_name=\"]")).every((a) => a.textContent.trim() !== "")'
        truthy: true
        expect: 概要行酒店名链接非空
      - id: 取概要行酒店名
        as: admin
        type: extract
        selector: '.tbl a[href*="hotel_name="]'
        into: hotel_name
        when: 'document.querySelector(".tbl a[href*=\"hotel_name=\"]") !== null'
        expect: 取概要行酒店名
      - id: 点酒店名下钻
        as: admin
        type: click
        selector: '.tbl a[href*="hotel_name="]'
        when: 'document.querySelector(".tbl a[href*=\"hotel_name=\"]") !== null'
        expect: 点酒店名下钻
      - id: 下钻后酒店名回显
        as: admin
        type: js_assert
        script: '(() => { const input = document.querySelector("input[name=hotel_name]"); if (input === null) return false; if (!document.querySelector(".tbl a[href*=\"hotel_name=\"]") && input.value === "") return true; const drill = location.href.includes("hotel_name="); return drill ? input.value.trim() !== "" : true; })()'
        truthy: true
        expect: 下钻后酒店名回显
      - id: 下钻到证据视图时含表格组（概要为空时跳过）
        as: admin
        type: js_assert
        script: '(() => { const input = document.querySelector("input[name=hotel_name]"); const tables = document.querySelectorAll(".tbl").length; if (input === null || input.value.trim() === "") return true; return tables >= 1; })()'
        truthy: true
        expect: 下钻到证据视图时含表格组（概要为空时跳过）

  - id: 订单观测
    type: flow
    expect: 订单观测 tab 激活，概况含同步状态，至少一张表渲染
    steps:
      # ---------- O04 订单观测 ----------
      - id: 打开订单观测
        as: admin
        type: navigate
        url: /observe?mode=orders
      - id: 订单观测tab激活
        as: admin
        type: dom_assert
        selector: '.tabs.sub a.tab.on'
        contains: 订单观测
        expect: 订单观测 tab 激活
      - id: 概况条含同步状态
        as: admin
        type: js_assert
        script: '(document.querySelector("main.content") || { textContent: "" }).textContent.includes("同步状态")'
        truthy: true
        expect: 概况条含同步状态
      - id: 三表（或空态）渲染
        as: admin
        type: dom_assert
        selector: '.tbl'
        countAtLeast: 1
        expect: 三表（或空态）渲染

  - id: 价格观测
    type: flow
    expect: 价格观测 tab 激活，偏差概况在，偏差表或「今日无偏差。」
    steps:
      # ---------- O05 价格观测 ----------
      - id: 打开价格观测
        as: admin
        type: navigate
        url: /observe?mode=price
      - id: 价格观测tab激活
        as: admin
        type: dom_assert
        selector: '.tabs.sub a.tab.on'
        contains: 价格观测
        expect: 价格观测 tab 激活
      - id: 偏差概况条在
        as: admin
        type: js_assert
        script: '(document.querySelector("main.content") || { textContent: "" }).textContent.includes("信科抽检偏差")'
        truthy: true
        expect: 偏差概况条在
      - id: 偏差表或「今日无偏差。」
        as: admin
        type: js_assert
        script: '(() => { const t = (document.querySelector("main.content") || { textContent: "" }).textContent; return t.includes("今日无偏差。") || document.querySelectorAll(".tbl").length >= 1; })()'
        truthy: true
        expect: 偏差表或「今日无偏差。」

  - id: 创建E2E旁路店铺
    type: flow
    expect: E2E 店创建成功（旁路用例身份）
    steps:
      # ---------- admin 创建 E2E 店（旁路用例身份） ----------
      - id: 建店-打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 建店-点击增加店铺
        as: admin
        type: click
        selector: '#btn-add-shop'
        waitFor: '#adddlg[open]'
      - id: 建店-填写店铺名
        as: admin
        type: fill
        selector: '#adddlg input[name="name"]'
        value: ${var:shopName}
      - id: 建店-填写店铺账号
        as: admin
        type: fill
        selector: '#adddlg input[name="username"]'
        value: ${var:shopUser}
      - id: 建店-保存
        as: admin
        type: click
        selector: '#adddlg button.btn'
      - id: E2E店创建成功
        as: admin
        type: dom_assert
        selector: '.content .flash'
        contains: 已创建
        expect: E2E 店创建成功

  - id: E2E店身份登录
    type: flow
    expect: E2E 店身份登录成功
    steps:
      # ---------- e2e 登录 ----------
      - id: 店铺账号打开登录页
        as: e2e
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: e2e
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: e2e
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: e2e
        type: click
        selector: 'form button[type="submit"]'
      - id: E2E店身份登录成功
        as: e2e
        type: wait
        selector: '.topbar .usermenu'
        expect: E2E 店身份登录成功

  - id: 非admin旁路锁本店
    type: flow
    expect: 非 admin 酒店提示与概要仅本店；订单观测 shop_id 过滤为已知缺陷（onFail warn）
    steps:
      # ---------- OS01 非 admin 诊断锁本店 ----------
      - id: 旁路打开诊断页
        as: e2e
        type: navigate
        url: /diagnosis?shop_id=7
      - id: 等诊断页加载
        as: e2e
        type: wait
        selector: '.content'
      - id: 酒店提示只可能是本店（E2E前缀）
        as: e2e
        type: js_assert
        script: 'Array.from(document.querySelectorAll("#hotel-hint option")).every((o) => (o.getAttribute("value") || "").startsWith("E2E"))'
        truthy: true
        expect: 酒店提示只可能是本店（E2E 前缀）
      - id: 概要行也只含本店酒店
        as: e2e
        type: js_assert
        script: 'Array.from(document.querySelectorAll(".tbl a[href*=\"hotel_name=\"]")).every((a) => a.textContent.includes("E2E"))'
        truthy: true
        expect: 概要行也只含本店酒店
      - id: 旁路访问订单观测指定店
        as: e2e
        type: navigate
        url: /observe?mode=orders&shop_id=7
      - id: 同步状态表只出现本店——已知缺陷：sync_rows未按shop_id过滤，当前
        as: e2e
        type: js_assert
        script: '(() => { const first = document.querySelector(".tbl"); if (first === null) return true; const rows = first.querySelectorAll("tbody tr"); if (rows.length === 0) return true; return rows.length <= 1 && rows[0].textContent.includes("E2E-"); })()'
        truthy: true
        onFail: warn
        expect: 同步状态表只出现本店——已知缺陷：sync_rows 未按 shop_id 过滤，当前预期失败

teardown:
  - id: 收尾登录并停用E2E店留档
    type: flow
    expect: admin 重新登录，若 E2E 店仍在营则停用留档
    steps:
      - id: 收尾打开登录页
        as: admin
        type: navigate
        url: /login
      - id: 收尾填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: 收尾填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: 收尾提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: 收尾等登录完成
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 收尾打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 收尾等列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 停用E2E店留档（仅当仍在营）
        as: admin
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
        when: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); return ((row || {}).querySelector ? (row.querySelector(".pill") || { textContent: "" }).textContent : "").trim() === "在营"; })()'
        onFail: warn
        expect: 停用 E2E 店留档（仅当仍在营）

