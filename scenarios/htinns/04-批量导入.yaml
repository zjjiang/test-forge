# 场景四 v4：批量导入 Excel（真实酒店名 + 信科为准）+ 任务进度页验证
# 数据纪律：复用固定夹具店 E2E-批量-1105-160745（shop_id=125，初始密码 123456），不新增店铺；
#           Excel 路径放项目变量 IMPORT_XLSX；10 行是信科账号内实测可搜到且有飞猪映射的真实酒店
# 关键口径（源码 _fetch_row）：店铺有信科凭证 → 逐行走信科搜索、信科数据为准（Excel 名字仅作关键字）；
#           无凭证 → Excel 列原样入库。本场景配置凭证，走生产同款信科链路（每行限速 0.5s）
# 链路：基线登录 → 配凭证 → 批量弹窗上传 → flash 任务已创建 → /tasks 刷新轮询首行（本次任务）
#       已完成 10/10（reload:true，只认首行避免历史任务假阳性）→ 列表 10 行
#       → 收尾用删除功能逐行清空夹具酒店（下次运行从空店重建）
module: 酒店管理
name: 批量导入Excel与任务进度
description: 对应用户场景 4；批量上传 10 家真实酒店（信科为准），验证后台任务链路与任务界面（复用夹具店，收尾自动清理）
version: 4
trace: false
requires:
  env: [IMPORT_XLSX, XK_COOKIE]
variables:
  shopUser: "e2ebat_20261105160745"
actors:
  shop:
    description: 夹具店铺身份（E2E-批量-1105-160745）
    dialogs: accept
steps:
  - id: 店侧基线登录
    type: flow
    expect: 夹具店账号可正常登录（基线）
    steps:
      - id: 店铺账号打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 基线登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
  - id: 店侧配置信科凭证
    type: flow
    expect: 本店信科平台ID（499）与Cookie（XK_COOKIE）保存成功——导入走信科为准的前提
    steps:
      - id: 打开店铺配置页
        as: shop
        type: navigate
        url: /settings/shop
      - id: 等本店行加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 打开本店编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-edit'
        waitFor: '#editdlg[open]'
      - id: 填写信科店铺ID
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_shop_id"]'
        value: "499"
      - id: 填写真实Cookie
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_cookie"]'
        value: ${var:XK_COOKIE}
      - id: 保存凭证
        as: shop
        type: click
        selector: '#editdlg button.btn'
      - id: flash提示已保存
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存
  - id: 批量弹窗上传Excel
    type: flow
    expect: 批量操作弹窗上传 IMPORT_XLSX（10 行真实酒店），提交后提示任务已创建
    steps:
      - id: 打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 点击批量操作
        as: shop
        type: click
        selector: '#btn-import'
        waitFor: '#batchdlg[open]'
        expect: 打开批量操作弹窗
      - id: 上传Excel文件
        as: shop
        type: upload
        selector: '#batchform input[type="file"]'
        path: ${var:IMPORT_XLSX}
        expect: 选择本地 Excel 数据文件（IMPORT_XLSX）
      - id: 提交导入
        as: shop
        type: click
        selector: '#batchform button[type="submit"]'
      - id: flash提示任务已创建
        as: shop
        type: js_assert
        script: '(document.querySelector(".content .flash") || { textContent: "" }).textContent'
        contains: 任务已创建
        expect: 任务已创建（含任务号与行数）
      - id: 提示共10行
        as: shop
        type: js_assert
        script: '(document.querySelector(".content .flash") || { textContent: "" }).textContent'
        contains: 共 10 行
        expect: 解析出全部 10 行
  - id: 任务进度页验证
    type: flow
    expect: /tasks 页首行（最新任务=本次运行）翻转为「已完成 10/10」，环节截图即任务创建成功证据
    steps:
      - id: 打开任务进度页
        as: shop
        type: navigate
        url: /tasks
      - id: 等任务表渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 导入任务已完成10行
        as: shop
        type: js_assert
        timeoutMs: 600000
        reload: true
        script: '(() => { const tr = document.querySelector(".tbl tbody tr"); return tr !== null && tr.textContent.includes("酒店导入") && tr.textContent.includes("已完成") && tr.textContent.includes("10/10"); })()'
        truthy: true
        expect: 最新一行（=本次运行的任务，表按创建时间倒序）翻转为已完成 10/10——只认首行，避免被历史任务行骗过；该环节总结截图即任务创建成功证据
      - id: 环节结束帧=任务页
        as: shop
        type: js_assert
        script: 'document.querySelectorAll(".tbl tbody tr").length >= 1'
        truthy: true
        expect: 任务列表有记录
  - id: 列表验证10家酒店
    type: flow
    expect: 信科为准入库后，夹具店列表恰 10 行在营酒店
    steps:
      - id: 回到酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载2
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: KPI在营10家
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 180000
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return card !== undefined && card.textContent.includes("10"); })()'
        truthy: true
        expect: 在营酒店 KPI 为 10（reload 轮询等后台导入完成——夹具店复用后 /tasks 有历史任务，不能以任务页为准）
      - id: 列表恰10行
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 180000
        script: 'document.querySelectorAll(".tbl tbody tr").length === 10'
        truthy: true
        expect: 导入完成后列表恰 10 行（真实酒店名，信科数据为准）
teardown:
  - id: 收尾清空夹具酒店
    type: flow
    expect: 用删除功能逐行清空导入的酒店，跑完店铺酒店列表为空（不残留数据）
    steps:
      - id: 收尾打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 收尾等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第01家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第02家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第03家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第04家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第05家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第06家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第07家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第08家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第09家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第10家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾列表清空
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 15000
        script: 'document.querySelectorAll(".tbl tbody tr .btn-del").length === 0 && !Array.from(document.querySelectorAll(".tbl tbody tr")).some((tr) => tr.querySelector("td b"))'
        truthy: true
        expect: 收尾后无可删除酒店（空列表页有「该店暂无酒店配置」占位行，故按无 b 名称行断言；下次运行从空店重建 10 行）
