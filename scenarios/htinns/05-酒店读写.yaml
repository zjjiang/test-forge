# 场景五：酒店管理页读写主链路（夹具：手工新增 2 家，不依赖信科）
# 读：搜索/分页计数/导出CSV；写：编辑预填与保存、行内打标（即改即存+落库回显）、停用与启用
# 口径备忘（源码）：编辑保存 flash「已保存修改」；打标 onchange 提交 flash「已更新 N 项标签」，
#   无 SHID 的行打标下拉禁用（夹具酒店必须带 SHID）；停用/启用是行内表单裸按钮，flash 已停用/已启用
name: 酒店管理读写走查
description: 对应用户场景 5 主链路；酒店页搜索/分页/导出 + 编辑/打标/停用启用全读写面
version: 1
trace: false
requires:
  env: []
variables:
  shopName: "E2E-读写-${var:RUN_STAMP}"
  shopUser: "e2erw_${var:RUN_DATE}${var:RUN_TIME}"
actors:
  admin:
    description: 管理员
    dialogs: accept
  shop:
    description: E2E 测试店铺身份
    dialogs: accept
steps:
  - id: 管理员登录并新增E2E店
    type: flow
    expect: admin 登录成功并创建 E2E 测试店
    steps:
      - id: admin打开登录页
        as: admin
        type: navigate
        url: /login
      - id: admin填写账号
        as: admin
        type: fill
        selector: 'input[name="username"]'
        value: ${var:ADMIN_USER}
      - id: admin填写密码
        as: admin
        type: fill
        selector: 'input[name="password"]'
        value: ${var:ADMIN_PW}
      - id: admin提交登录
        as: admin
        type: click
        selector: 'form button[type="submit"]'
      - id: admin登录成功
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 等店铺列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 点击增加店铺
        as: admin
        type: click
        selector: '#btn-add-shop'
        waitFor: '#adddlg[open]'
      - id: 填写店铺名
        as: admin
        type: fill
        selector: '#adddlg input[name="name"]'
        value: ${var:shopName}
      - id: 填写店铺账号
        as: admin
        type: fill
        selector: '#adddlg input[name="username"]'
        value: ${var:shopUser}
      - id: 保存新店
        as: admin
        type: click
        selector: '#adddlg button.btn'
      - id: E2E店创建成功
        as: admin
        type: dom_assert
        selector: '.content .flash'
        contains: 已创建
  - id: 店侧基线登录
    type: flow
    expect: E2E 店账号可正常登录（基线）
    steps:
      - id: 店铺账号打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 基线登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
  - id: 手工新增两家夹具酒店
    type: flow
    expect: 手填两家用作读写夹具（带 SHID 否则打标下拉禁用），列表恰 2 行
    steps:
      - id: 打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 新增A-打开弹窗
        as: shop
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
      - id: 新增A-填名称
        as: shop
        type: fill
        selector: '#hotelform input[name="hotel_name"]'
        value: E2E-读写A
      - id: 新增A-填SHID
        as: shop
        type: fill
        selector: '#hotelform input[name="fliggy_shid"]'
        value: E2E-SH-001
      - id: 新增A-填城市
        as: shop
        type: fill
        selector: '#hotelform input[name="city_name"]'
        value: 郑州
      - id: 新增A-保存
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: 新增A-flash已新增
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已新增酒店
      - id: 新增B-打开弹窗
        as: shop
        type: click
        selector: '#btn-new'
        waitFor: '#hoteldlg[open]'
      - id: 新增B-填名称
        as: shop
        type: fill
        selector: '#hotelform input[name="hotel_name"]'
        value: E2E-读写B
      - id: 新增B-填SHID
        as: shop
        type: fill
        selector: '#hotelform input[name="fliggy_shid"]'
        value: E2E-SH-002
      - id: 新增B-填城市
        as: shop
        type: fill
        selector: '#hotelform input[name="city_name"]'
        value: 洛阳
      - id: 新增B-保存
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: 新增B-flash已新增
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已新增酒店
      - id: 列表恰2行
        as: shop
        type: js_assert
        script: 'document.querySelectorAll(".tbl tbody tr").length === 2'
        truthy: true
        expect: 夹具就绪，恰 2 行
  - id: 搜索与分页计数
    type: flow
    expect: 关键字搜索恰命中 A 一家；清空后计数条「共 2 家 · 第 1 / 1 页」
    steps:
      - id: 搜索框填A
        as: shop
        type: fill
        selector: '.controls input[name="q"]'
        value: E2E-读写A
      - id: 回车提交搜索
        as: shop
        type: press
        selector: '.controls input[name="q"]'
        key: Enter
      - id: 恰命中A一行
        as: shop
        type: js_assert
        script: '(() => { const rows = Array.from(document.querySelectorAll(".tbl tbody tr")); return rows.length === 1 && rows[0].textContent.includes("E2E-读写A") && !rows[0].textContent.includes("E2E-读写B"); })()'
        truthy: true
        expect: 搜索只命中 E2E-读写A
      - id: 清空回全量列表
        as: shop
        type: navigate
        url: /hotels
      - id: 计数条自洽
        as: shop
        type: js_assert
        script: '(() => { const note = Array.from(document.querySelectorAll("p.note")).map((p) => p.textContent).find((t) => t.includes("共")); return note !== undefined && note.includes("共 2 家") && note.includes("第 1 / 1 页"); })()'
        truthy: true
        expect: 「共 2 家 · 第 1 / 1 页」互洽
  - id: 导出CSV
    type: flow
    expect: 导出按钮落盘 hotels_*.csv
    steps:
      - id: 点击导出CSV
        as: shop
        type: download
        click: 'a.chip[href*="export"]'
        namePrefix: hotels_
        nameSuffix: .csv
        expect: 导出文件下载成功
  - id: 编辑酒店
    type: flow
    expect: 编辑弹窗预填当前值，改城市与电话保存后行内回显
    steps:
      - id: 打开A的编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("E2E-读写A")) .btn-edit'
        waitFor: '#hoteldlg[open]'
      - id: 弹窗预填当前名称
        as: shop
        type: js_assert
        script: 'document.querySelector("#hotelform input[name=\"hotel_name\"]").value'
        equals: E2E-读写A
        expect: 编辑弹窗预填既有值
      - id: 改城市为西安
        as: shop
        type: fill
        selector: '#hotelform input[name="city_name"]'
        value: 西安
      - id: 填电话
        as: shop
        type: fill
        selector: '#hotelform input[name="phone"]'
        value: 029-88886666
      - id: 保存修改
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: flash已保存修改
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存修改
      - id: 行内回显新城市
        as: shop
        type: js_assert
        script: '(() => { const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-读写A")); return row !== undefined && row.textContent.includes("西安"); })()'
        truthy: true
        expect: 列表行回显修改后的城市
  - id: 行内打标
    type: flow
    expect: 状态选优质、档位选高（即改即存），刷新回显落库；优质筛选恰命中 A
    steps:
      - id: A行状态选优质
        as: shop
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("E2E-读写A")) select[name="status_tag"]'
        value: 优质酒店
        expect: 行内状态即改即存
      - id: flash已更新标签
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已更新
      - id: A行档位选高
        as: shop
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("E2E-读写A")) select[name="ratio_tier"]'
        value: 高
      - id: 优质筛选恰命中A
        as: shop
        type: navigate
        url: /hotels?tag=优质酒店
      - id: 筛选结果恰1行A
        as: shop
        type: js_assert
        script: '(() => { const rows = Array.from(document.querySelectorAll(".tbl tbody tr")); return rows.length === 1 && rows[0].textContent.includes("E2E-读写A"); })()'
        truthy: true
        expect: 优质标签筛选恰命中 E2E-读写A
      - id: 回全量并验证回显落库
        as: shop
        type: navigate
        url: /hotels
      - id: A行选中值仍为优质
        as: shop
        type: js_assert
        script: '(() => { const sel = document.querySelector(".tbl tbody tr select[name=\"status_tag\"]") || Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-读写A")); const s = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-读写A")); if (s === undefined) return false; const v = s.querySelector("select[name=\"status_tag\"]"); return v !== null && v.value === "优质酒店"; })()'
        truthy: true
        expect: 刷新后下拉选中值仍为优质（已落库）
  - id: 停用与启用
    type: flow
    expect: 行内停用后 KPI 1/2，再启用恢复 2/2
    steps:
      - id: A行点击停用
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("E2E-读写A")) td.ops form button'
        when: '(() => { const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-读写A")); const btn = row && row.querySelector("td.ops form button"); return btn !== null && btn.textContent.trim() === "停用"; })()'
        waitFor: '.content .flash'
      - id: flash已停用
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已停用
      - id: KPI在营1家
        as: shop
        type: js_assert
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return card !== undefined && card.textContent.includes("1"); })()'
        truthy: true
        expect: 停用后在营 KPI 为 1/2
      - id: A行点击启用
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("E2E-读写A")) td.ops form button'
        when: '(() => { const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("E2E-读写A")); const btn = row && row.querySelector("td.ops form button"); return btn !== null && btn.textContent.trim() === "启用"; })()'
        waitFor: '.content .flash'
      - id: flash已启用
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已启用
      - id: KPI恢复2家
        as: shop
        type: js_assert
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return card !== undefined && card.textContent.includes("2"); })()'
        truthy: true
        expect: 启用后恢复 2/2
teardown:
  - id: 收尾停用E2E店留档
    type: flow
    expect: E2E 店若仍在营则停用留档
    steps:
      - id: 收尾等登录完成
        as: admin
        type: wait
        selector: '.topbar .usermenu'
      - id: 收尾打开店铺配置页
        as: admin
        type: navigate
        url: /settings/shop
      - id: 收尾等列表加载
        as: admin
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 停用E2E店留档（仅当仍在营）
        as: admin
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("${var:shopName}")) .btn-toggle'
        when: '(() => { const name = "${var:shopName}"; const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => ((tr.querySelector("td b") || { textContent: "" }).textContent || "").trim() === name); return ((row || {}).querySelector ? (row.querySelector(".pill") || { textContent: "" }).textContent : "").trim() === "在营"; })()'
        onFail: warn
