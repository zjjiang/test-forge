# 场景五 v4：酒店管理页读写主链路（数据纪律 v2：酒店也用真实数据）
# 夹具店 E2E-读写-1105-142121（shop_id=116，初始密码 123456）；
# 夹具酒店不再用编造的 E2E-读写A/B，改为批量导入 IMPORT_XLSX 的 10 家真实酒店（信科为准，
# 带真实 SHID/供应商/城市），写操作（编辑/打标/停用）只发生在夹具店内且收尾全部删除，不影响真实店
# 读：搜索/分页计数/导出CSV；写：编辑预填与保存、行内打标（即改即存+落库回显）、停用与启用
# 信科偶发超时（单行30s读超时）会致个别行失败：门禁以酒店列表轮询为准（reload 轮询恰 10 行，
# 不去任务页等「已完成」——导入提交后重定向回 /hotels，任务行完成即清）；补导环节整份 Excel
# 幂等重导（upsert，已有行走更新、缺失行补进）兜底；收尾逐行删除，跑完店铺列表为空
name: 酒店管理读写走查
description: 对应用户场景 5 主链路；酒店页搜索/分页/导出 + 编辑/打标/停用启用全读写面（夹具店 + Excel 真实酒店，收尾自动清理）
version: 4
trace: false
requires:
  env: [IMPORT_XLSX, XK_COOKIE]
variables:
  shopUser: "e2erw_20261105142121"
actors:
  shop:
    description: 夹具店铺身份（E2E-读写-1105-142121）
    dialogs: accept
steps:
  - id: 店侧基线登录
    type: flow
    expect: 夹具店账号可正常登录（基线）
    steps:
      - id: 店铺账号打开登录页
        as: shop
        type: navigate
        url: /login
      - id: 店铺账号填写用户名
        as: shop
        type: fill
        selector: 'input[name="username"]'
        value: ${var:shopUser}
      - id: 店铺账号填写密码
        as: shop
        type: fill
        selector: 'input[name="password"]'
        value: "123456"
      - id: 店铺账号提交登录
        as: shop
        type: click
        selector: 'form button[type="submit"]'
      - id: 基线登录成功
        as: shop
        type: wait
        selector: '.topbar .usermenu'
  - id: 店侧配置信科凭证
    type: flow
    expect: 本店信科平台ID（499）与Cookie（XK_COOKIE）保存成功——导入走信科为准的前提
    steps:
      - id: 打开店铺配置页
        as: shop
        type: navigate
        url: /settings/shop
      - id: 等本店行加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 打开本店编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-edit'
        waitFor: '#editdlg[open]'
      - id: 填写信科店铺ID
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_shop_id"]'
        value: "499"
      - id: 填写真实Cookie
        as: shop
        type: fill
        selector: '#editdlg input[name="xk_cookie"]'
        value: ${var:XK_COOKIE}
      - id: 保存凭证
        as: shop
        type: click
        selector: '#editdlg button.btn'
      - id: flash提示已保存
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存
  - id: 批量导入10家真实酒店
    type: flow
    expect: 上传 IMPORT_XLSX（10 家真实酒店，信科为准入库，带真实 SHID/供应商/城市），任务结束列表恰 10 行
    steps:
      - id: 打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 点击批量操作
        as: shop
        type: click
        selector: '#btn-import'
        waitFor: '#batchdlg[open]'
        expect: 打开批量操作弹窗
      - id: 上传Excel文件
        as: shop
        type: upload
        selector: '#batchform input[type="file"]'
        path: ${var:IMPORT_XLSX}
        expect: 选择本地 Excel 数据文件（IMPORT_XLSX）
      - id: 提交导入
        as: shop
        type: click
        selector: '#batchform button[type="submit"]'
      - id: flash提示任务已创建
        as: shop
        type: js_assert
        script: '(document.querySelector(".content .flash") || { textContent: "" }).textContent'
        contains: 任务已创建
        expect: 任务已创建（含任务号与行数）
      - id: 提示共10行
        as: shop
        type: js_assert
        script: '(document.querySelector(".content .flash") || { textContent: "" }).textContent'
        contains: 共 10 行
        expect: 解析出全部 10 行
      # 不去任务进度页轮询「已完成」：导入提交后重定向回 /hotels，
      # 任务页需额外导航且任务行完成即清；真正的门禁是下面的列表恰 10 行
      # （reload 轮询最长 10 分钟，信科单行最久 30s 超时、个别行失败由补导环节兜底）
      - id: 回酒店页等列表10行
        as: shop
        type: navigate
        url: /hotels
      - id: 列表恰10行在营
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 600000
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return document.querySelectorAll(".tbl tbody tr").length === 10 && card !== undefined && card.textContent.includes("10"); })()'
        truthy: true
        expect: 夹具就绪，10 家真实酒店全部入库且在营
  - id: 补导缺失行（仅当不足10行）
    type: flow
    expect: Excel 为 upsert 幂等语义，若首轮个别行信科超时失败，则整份 Excel 再导一遍（已有行走更新，缺失行补进），直到列表恰 10 行
    steps:
      - id: 回酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 等列表加载3
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 补导-点击批量操作
        as: shop
        type: click
        selector: '#btn-import'
        waitFor: '#batchdlg[open]'
        when: 'document.querySelectorAll(".tbl tbody tr").length < 10'
      - id: 补导-上传Excel
        as: shop
        type: upload
        selector: '#batchform input[type="file"]'
        path: ${var:IMPORT_XLSX}
        when: 'document.querySelectorAll(".tbl tbody tr").length < 10'
      - id: 补导-提交导入
        as: shop
        type: click
        selector: '#batchform button[type="submit"]'
        when: 'document.querySelectorAll(".tbl tbody tr").length < 10'
      - id: 补导-等列表凑齐10行
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 600000
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return document.querySelectorAll(".tbl tbody tr").length === 10 && card !== undefined && card.textContent.includes("10"); })()'
        truthy: true
        expect: 补导后列表恰 10 行在营（已满 10 行则本环节直接通过）
  - id: 任务进度留痕
    type: flow
    expect: /tasks 页最新一行（=本次导入任务，表按创建时间倒序）状态已完成，环节总结截图即任务创建成功的留痕证据
    steps:
      - id: 打开任务进度页
        as: shop
        type: navigate
        url: /tasks
      - id: 等任务表渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 最新导入任务已完成
        as: shop
        type: js_assert
        timeoutMs: 600000
        reload: true
        script: '(() => { const tr = document.querySelector(".tbl tbody tr"); return tr !== null && tr.textContent.includes("酒店导入") && tr.textContent.includes("已完成"); })()'
        truthy: true
        expect: 首行（本次任务）已完成——只认首行，夹具店复用后历史任务行不参与判定
  - id: 搜索与分页计数
    type: flow
    expect: 关键字搜索恰命中「连云港海州湾voco酒店」一家；清空后计数条「共 10 家 · 第 1 / 1 页」
    steps:
      - id: 回酒店管理页再搜索
        as: shop
        type: navigate
        url: /hotels
      - id: 等搜索页列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 搜索框填真实酒店名
        as: shop
        type: fill
        selector: '.controls input[name="q"]'
        value: 连云港海州湾voco酒店
      - id: 回车提交搜索
        as: shop
        type: press
        selector: '.controls input[name="q"]'
        key: Enter
      - id: 恰命中该酒店一行
        as: shop
        type: js_assert
        script: '(() => { const rows = Array.from(document.querySelectorAll(".tbl tbody tr")); return rows.length === 1 && rows[0].textContent.includes("连云港海州湾voco酒店"); })()'
        truthy: true
        expect: 搜索只命中连云港海州湾voco酒店
      - id: 清空回全量列表
        as: shop
        type: navigate
        url: /hotels
      - id: 计数条自洽
        as: shop
        type: js_assert
        script: '(() => { const note = Array.from(document.querySelectorAll("p.note")).map((p) => p.textContent).find((t) => t.includes("共")); return note !== undefined && note.includes("共 10 家") && note.includes("第 1 / 1 页"); })()'
        truthy: true
        expect: 「共 10 家 · 第 1 / 1 页」互洽
  - id: 导出CSV
    type: flow
    expect: 导出按钮落盘 hotels_*.csv
    steps:
      - id: 点击导出CSV
        as: shop
        type: download
        click: 'a.chip[href*="export"]'
        namePrefix: hotels_
        nameSuffix: .csv
        expect: 导出文件下载成功
  - id: 编辑真实酒店
    type: flow
    expect: 编辑弹窗预填当前值，改城市与电话保存后行内回显（仅改夹具店内数据，收尾删除）
    steps:
      - id: 打开真实酒店的编辑弹窗
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("连云港海州湾voco酒店")) .btn-edit'
        waitFor: '#hoteldlg[open]'
      - id: 弹窗预填当前名称
        as: shop
        type: js_assert
        script: 'document.querySelector("#hotelform input[name=\"hotel_name\"]").value'
        equals: 连云港海州湾voco酒店
        expect: 编辑弹窗预填既有值
      - id: 改城市为西安
        as: shop
        type: fill
        selector: '#hotelform input[name="city_name"]'
        value: 西安
      - id: 填电话
        as: shop
        type: fill
        selector: '#hotelform input[name="phone"]'
        value: 029-88886666
      - id: 保存修改
        as: shop
        type: click
        selector: '#hotelform button[type="submit"]'
      - id: flash已保存修改
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已保存修改
      - id: 行内回显新城市
        as: shop
        type: js_assert
        script: '(() => { const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("连云港海州湾voco酒店")); return row !== undefined && row.textContent.includes("西安"); })()'
        truthy: true
        expect: 列表行回显修改后的城市
  - id: 行内打标
    type: flow
    expect: 状态选优质、档位选高（即改即存），刷新回显落库；优质筛选恰命中该真实酒店
    steps:
      - id: 该行状态选优质
        as: shop
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("连云港海州湾voco酒店")) select[name="status_tag"]'
        value: 优质酒店
        expect: 行内状态即改即存
      - id: flash标签提交完成
        as: shop
        type: js_assert
        script: '/(已更新|标签无变更)/.test((document.querySelector(".content .flash") || { textContent: "" }).textContent)'
        truthy: true
        expect: 打标提交被受理（变更报已更新，重复值报无变更）
      - id: 该行档位选高
        as: shop
        type: select
        selector: '.tbl tbody tr:has(td b:text-is("连云港海州湾voco酒店")) select[name="ratio_tier"]'
        value: 高
      - id: 等打标刷新完成
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 优质筛选恰命中该酒店
        as: shop
        type: navigate
        url: /hotels?tag=优质酒店
      - id: 筛选结果恰1行
        as: shop
        type: js_assert
        script: '(() => { const rows = Array.from(document.querySelectorAll(".tbl tbody tr")); return rows.length === 1 && rows[0].textContent.includes("连云港海州湾voco酒店"); })()'
        truthy: true
        expect: 优质标签筛选恰命中该真实酒店
      - id: 回全量并验证回显落库
        as: shop
        type: navigate
        url: /hotels
      - id: 该行选中值仍为优质
        as: shop
        type: js_assert
        script: '(() => { const s = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("连云港海州湾voco酒店")); if (s === undefined) return false; const v = s.querySelector("select[name=\"status_tag\"]"); return v !== null && v.value === "优质酒店"; })()'
        truthy: true
        expect: 刷新后下拉选中值仍为优质（已落库）
  - id: 停用与启用
    type: flow
    expect: 行内停用后 KPI 9/10，再启用恢复 10/10
    steps:
      - id: 该行点击停用
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("连云港海州湾voco酒店")) td.ops form button'
        when: '(() => { const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("连云港海州湾voco酒店")); const btn = row && row.querySelector("td.ops form button"); return btn !== null && btn.textContent.trim() === "停用"; })()'
        waitFor: '.content .flash'
      - id: flash已停用
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已停用
      - id: KPI在营9家
        as: shop
        type: js_assert
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return card !== undefined && card.textContent.includes("9"); })()'
        truthy: true
        expect: 停用后在营 KPI 为 9/10
      - id: 该行点击启用
        as: shop
        type: click
        selector: '.tbl tbody tr:has(td b:text-is("连云港海州湾voco酒店")) td.ops form button'
        when: '(() => { const row = Array.from(document.querySelectorAll(".tbl tbody tr")).find((tr) => tr.textContent.includes("连云港海州湾voco酒店")); const btn = row && row.querySelector("td.ops form button"); return btn !== null && btn.textContent.trim() === "启用"; })()'
        waitFor: '.content .flash'
      - id: flash已启用
        as: shop
        type: dom_assert
        selector: '.content .flash'
        contains: 已启用
      - id: KPI恢复10家
        as: shop
        type: js_assert
        script: '(() => { const card = Array.from(document.querySelectorAll(".kpi")).find((k) => k.textContent.includes("在营酒店")); return card !== undefined && card.textContent.includes("10"); })()'
        truthy: true
        expect: 启用后恢复 10/10
teardown:
  - id: 收尾清空导入酒店
    type: flow
    expect: 用删除功能逐行清空导入的酒店，跑完店铺酒店列表为空（不残留数据）
    steps:
      - id: 收尾打开酒店管理页
        as: shop
        type: navigate
        url: /hotels
      - id: 收尾等列表加载
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第01家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第02家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第03家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第04家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第05家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第06家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第07家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第08家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第09家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾删除第10家
        as: shop
        type: click
        selector: '.tbl tbody tr .btn-del'
        when: 'document.querySelector(".tbl tbody tr .btn-del") !== null'
        waitFor: '.content .flash'
        onFail: warn
      - id: 等表格重渲染
        as: shop
        type: wait
        selector: '.tblwrap table.tbl'
      - id: 收尾列表清空
        as: shop
        type: js_assert
        reload: true
        timeoutMs: 15000
        script: 'document.querySelectorAll(".tbl tbody tr .btn-del").length === 0 && !Array.from(document.querySelectorAll(".tbl tbody tr")).some((tr) => tr.querySelector("td b"))'
        truthy: true
        expect: 收尾后无可删除酒店（空列表占位行兼容；下次运行重新导入重建）
