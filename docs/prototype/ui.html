<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TestForge 控制台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 侧栏项目导航 + 右侧工作区；运行详情为「步骤轨道 | 证据面板」两栏，窄屏堆叠 */
:root{
 --bg:#f4f5f7;--card:#ffffff;--line:#dde1e8;--fg:#1a2030;--mut:#5d6679;
 --pri:#2f5bd3;--pri-soft:#e9eefc;
 --side:#151b29;--side-fg:#c3cad8;--side-on:#232c40;--side-mut:#78829a;
 --ok:#24804a;--bad:#c2362f;--rev:#b86a00;--skip:#79808c;
 --th:#f8f9fb;--code:#eef0f4;--warn-bg:#fff5e6;--warn-line:#f0cf9a;
 --stripe-a:#eceef2;--stripe-b:#e4e7ec;
 --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
 --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#10141d;--card:#171c28;--line:#2a3142;--fg:#e3e7ef;--mut:#959eb2;
 --pri:#7f9cff;--pri-soft:#1f2a47;--side:#0b0e15;--side-fg:#c3cad8;--side-on:#1c2333;--side-mut:#6d768c;
 --ok:#4cb877;--bad:#ef6b62;--rev:#e3a043;--skip:#8a919e;
 --th:#1b2130;--code:#222938;--warn-bg:#2b2213;--warn-line:#5c4518;--stripe-a:#1d2331;--stripe-b:#212839}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#10141d;--card:#171c28;--line:#2a3142;--fg:#e3e7ef;--mut:#959eb2;
 --pri:#7f9cff;--pri-soft:#1f2a47;--side:#0b0e15;--side-fg:#c3cad8;--side-on:#1c2333;--side-mut:#6d768c;
 --ok:#4cb877;--bad:#ef6b62;--rev:#e3a043;--skip:#8a919e;
 --th:#1b2130;--code:#222938;--warn-bg:#2b2213;--warn-line:#5c4518;--stripe-a:#1d2331;--stripe-b:#212839}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 var(--f-body);color:var(--fg);background:var(--bg);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app.solo{display:block}
.app.solo main{max-width:none;padding:0 0 40px}
.app.solo .home{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
aside{background:var(--card);border-right:1px solid var(--line);padding-block:18px;padding-left:env(safe-area-inset-left,0px);position:sticky;top:0;align-self:start;min-height:100vh}
aside .back{display:block;padding:4px 16px 14px;color:var(--pri);cursor:pointer;font-size:13px}
aside .pname{font:700 17px/1.25 var(--f-display);font-stretch:88%;padding:0 16px}
aside .purl{font:12px var(--f-mono);color:var(--mut);padding:2px 16px 14px;overflow-wrap:anywhere}
aside nav{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:8px}
aside nav a{display:flex;justify-content:space-between;padding:8px 16px;color:var(--fg);cursor:pointer;border-left:3px solid transparent}
aside nav a:hover{background:var(--pri-soft)}
aside nav a.on{background:var(--pri-soft);border-left-color:var(--pri);color:var(--pri);font-weight:600}
.cnt{font:12px var(--f-mono);color:var(--mut)}
.top{background:var(--side);color:var(--side-fg);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin-bottom:24px}
.top .mut{color:var(--side-mut)}
.brand{font:800 22px/1 var(--f-display);font-stretch:78%;letter-spacing:.03em;text-transform:uppercase;color:#fff}
.brand span{color:#8fa6ff}
.home{max-width:1200px;margin-inline:auto}
h3{font:700 16px/1.3 var(--f-display);margin:28px 0 10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:6px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--pri);box-shadow:0 2px 10px rgba(30,50,110,.10)}
.pcard .ph{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .ph b{font:700 18px/1.25 var(--f-display);font-stretch:90%}
.pcard code{align-self:flex-start}
.pcard dl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.pcard dt{font-size:11px;letter-spacing:.06em;color:var(--mut)}
.pcard dd{margin:0;font:600 18px/1.3 var(--f-display)}
.pf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.strip{display:inline-flex;gap:3px}.strip i{width:8px;height:16px;border-radius:2px;background:var(--skip)}
.strip i.passed{background:var(--ok)}.strip i.failed{background:var(--bad)}.strip i.needs_review{background:var(--rev)}
.form{display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:24px}
main{padding-block:22px 40px;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;width:100%;margin-inline:auto}
.crumb{color:var(--mut);font-size:13px;margin-bottom:6px}.crumb a{color:var(--pri);cursor:pointer}
h2{margin:0 0 14px;font:700 24px/1.2 var(--f-display);font-stretch:88%;text-wrap:balance;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:500;background:var(--th)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pri-soft)}
input,select{font:inherit;color:var(--fg);background:var(--card);padding:5px 8px;border:1px solid var(--line);border-radius:4px;width:100%}
button{font:inherit;color:var(--fg);padding:6px 12px;border-radius:4px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.link{border:0;background:none;color:var(--pri);padding:2px 4px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
code{font-family:var(--f-mono);background:var(--code);padding:1px 5px;border-radius:3px;font-size:12px}
.b{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.b.passed{background:var(--ok)}.b.failed{background:var(--bad)}.b.needs_review{background:var(--rev)}.b.skipped{background:var(--skip)}
.tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid}
.tag.det{color:var(--ok);border-color:var(--ok)}.tag.ai{color:var(--rev);border-color:var(--rev)}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.stat b{display:block;font:700 22px/1.3 var(--f-display)}
.steps{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.st{padding:8px 10px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.st.on{background:var(--pri-soft);border-color:var(--pri)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot{aspect-ratio:16/10;max-width:100%;background:repeating-linear-gradient(45deg,var(--stripe-a),var(--stripe-a) 10px,var(--stripe-b) 10px,var(--stripe-b) 20px);border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);font:12px var(--f-mono)}
.att{font:12px var(--f-mono);margin-top:4px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);padding:8px 10px;border-radius:4px;font-size:13px}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding-block:10px 0}
 aside nav{flex-direction:row;overflow-x:auto;border-top:0}
 aside nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;gap:6px}
 aside nav a.on{border-bottom-color:var(--pri)}
 .stat,.pcard dl{grid-template-columns:repeat(2,minmax(0,1fr))}
 .steps,.shots,.fgrid{grid-template-columns:1fr}
 .pgrid{grid-template-columns:1fr}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app" id="app"><aside id="side"></aside><main id="main"></main></div>
<script>
var DB = {
 projects:[
  {id:'htinns',name:'HTinns 新平台',desc:'htinns-server-v2 验收',baseUrl:'http://127.0.0.1:5005',
   vars:[
    {k:'BASE_URL',v:'http://127.0.0.1:5005',secret:false,note:'被测服务地址'},
    {k:'ADMIN_USER',v:'admin',secret:false,note:'管理员账号'},
    {k:'ADMIN_PW',v:'change-me',secret:true,note:''},
    {k:'XK_COOKIE',v:'sessionid=xxxx',secret:true,note:'真实信科 Cookie，场景 SC02 使用'},
    {k:'DATA_PREFIX',v:'E2E-',secret:false,note:'写操作只落此前缀（护栏）'},
    {k:'MIDSCENE_MODEL_FAMILY',v:'glm-v',secret:false,note:'AI 步骤模型族：智谱 GLM'},
    {k:'MIDSCENE_MODEL_NAME',v:'glm-4.5v',secret:false,note:'示例模型名，按实际可用填写'},
    {k:'MIDSCENE_MODEL_BASE_URL',v:'https://open.bigmodel.cn/api/paas/v4',secret:false,note:''},
    {k:'MIDSCENE_MODEL_API_KEY',v:'sk-xxxx',secret:true,note:'智谱 API Key'}],
   blocked:['/api/price/push','/api/crawl/run','/api/config/import'],
   scenarios:[
    {id:'SC01',name:'新店开通',actors:'admin → 新店账号',steps:7},
    {id:'SC02',name:'信科Cookie失效更换',actors:'店铺账号',steps:5},
    {id:'SC03',name:'酒店全景与新增',actors:'admin',steps:8}]},
  {id:'demo',name:'Demo 酒店预订',desc:'自带示例站点',baseUrl:'http://localhost:4173',
   vars:[{k:'BASE_URL',v:'http://localhost:4173',secret:false,note:''}],blocked:[],
   scenarios:[{id:'D01',name:'VIP用户酒店预订',actors:'vip-user',steps:6}]}],
 runs:[
  {id:'20261102-003',sc:'SC01',p:'htinns',st:'passed',dur:'38s',by:'Claude Code',at:'11-02 14:20'},
  {id:'20261102-002',sc:'SC02',p:'htinns',st:'needs_review',dur:'52s',by:'jiangzhijian',at:'11-02 11:05'},
  {id:'20261102-001',sc:'SC01',p:'htinns',st:'failed',dur:'21s',by:'Claude Code',at:'11-02 09:41'},
  {id:'20261101-004',sc:'SC03',p:'htinns',st:'passed',dur:'1m12s',by:'CI',at:'11-01 23:14'},
  {id:'20261101-002',sc:'SC02',p:'htinns',st:'skipped',dur:'0s',by:'CI',at:'11-01 08:12',why:'缺少变量 XK_COOKIE'},
  {id:'20261101-001',sc:'D01',p:'demo',st:'passed',dur:'44s',by:'jiangzhijian',at:'11-01 07:52'}]
};
var RUN_STEPS = [
 {id:'login',as:'admin',type:'navigate+fill',expect:'admin 登录成功，进入控制台',st:'passed',ms:2100,
  asserts:[{t:'dom',kind:'det',exp:'.topbar 可见',act:'可见',ok:true}]},
 {id:'open_shop',as:'admin',type:'ai_action',expect:'店铺配置页渲染，有「增加店铺」入口',st:'passed',ms:5400,
  ins:'打开店铺配置页',attempts:['#1 失败：未找到菜单「店铺配置」(超时 8s)','#2 成功'],
  asserts:[{t:'dom',kind:'det',exp:'#btn-add-shop 可见',act:'可见',ok:true}]},
 {id:'create',as:'admin',type:'fill+click',expect:'flash「已创建」，新店行状态「在营」',st:'passed',ms:3300,
  asserts:[{t:'dom',kind:'det',exp:'flash 包含「已创建」',act:'已创建店铺 E2E-场景店-1102-142012',ok:true},
           {t:'api',kind:'det',exp:'POST /settings/shop → 302',act:'302',ok:true}]},
 {id:'logout',as:'admin',type:'ai_action',expect:'退出登录，回到登录页',st:'passed',ms:4100,ins:'从右上角用户菜单退出登录',
  asserts:[{t:'visual',kind:'ai',exp:'页面是登录页',act:'Midscene：页面显示用户名/密码输入框和登录按钮',ok:true},
           {t:'dom',kind:'det',exp:'URL 包含 /login',act:'/login',ok:true}]},
 {id:'new_login',as:'newShop',type:'fill+click',expect:'新店账号登录，顶栏显示新店名',st:'passed',ms:2600,
  asserts:[{t:'dom',kind:'det',exp:'.topbar .uname 含店名',act:'E2E-场景店-1102-142012',ok:true}]},
 {id:'teardown:deactivate',as:'admin',type:'teardown',expect:'停用场景店，状态「停用」',st:'passed',ms:2900,
  asserts:[{t:'dom',kind:'det',exp:'状态 pill = 停用',act:'停用',ok:true}]}];
var S = {view:'home',p:null,tab:'scenarios',run:null,step:0,reveal:{}};
function proj(){return DB.projects.find(function(x){return x.id===S.p})}
function badge(s){var m={passed:'通过',failed:'失败',needs_review:'待人工复核',skipped:'跳过'};return '<span class="b '+s+'">'+m[s]+'</span>'}
function go(o){Object.assign(S,o);render()}
var TABS=[['scenarios','场景'],['runs','执行历史'],['vars','环境变量'],['guards','安全护栏']];
function openProject(id){go({view:'project',p:id,tab:'scenarios',filter:null,edit:null,reveal:{}})}
function home(){go({view:'home',p:null,creating:false})}
function runsOf(pid){return DB.runs.filter(function(r){return r.p===pid})}
function passRate(rs){var done=rs.filter(function(r){return r.st!=='skipped'});
 return done.length?Math.round(100*done.filter(function(r){return r.st==='passed'}).length/done.length)+'%':'—'}
function strip(rs){if(!rs.length)return '<span class="mut">还没有执行记录</span>';
 return '<span class="strip">'+rs.slice(0,10).reverse().map(function(r){return '<i class="'+r.st+'" title="'+r.id+' '+r.st+'"></i>'}).join('')+'</span>'}
function side(){var p=proj(),cur=S.view==='run'?'runs':S.tab;
 var h='<a class="back" onclick="home()">← 全部项目</a><div class="pname">'+p.name+'</div><div class="purl">'+p.baseUrl+'</div><nav>';
 TABS.forEach(function(t){var n=t[0]==='scenarios'?p.scenarios.length:t[0]==='runs'?runsOf(p.id).length:t[0]==='vars'?p.vars.length:p.blocked.length;
  h+='<a class="'+(cur===t[0]?'on':'')+'" onclick="go({view:\'project\',tab:\''+t[0]+'\',filter:null,edit:null})">'+t[1]+'<span class="cnt">'+n+'</span></a>'});
 return h+'</nav>'}
function viewHome(){
 var h='<header class="top"><div class="brand">Test<span>Forge</span></div><span class="mut">Data Forge · 场景驱动的 AI 测试平台</span></header>';
 h+='<div class="home"><div class="row"><h2>项目</h2><button class="pri" onclick="go({creating:true})">新建项目</button></div>';
 if(S.creating)h+=newProjectForm();
 h+='<div class="pgrid">';
 DB.projects.forEach(function(p){var rs=runsOf(p.id),last=rs[0];
  h+='<button class="pcard" onclick="openProject(\''+p.id+'\')"><div class="ph"><b>'+p.name+'</b>'+(last?badge(last.st):'')+'</div>'
   +'<div class="mut">'+p.desc+'</div><code>'+p.baseUrl+'</code>'
   +'<dl><div><dt>场景</dt><dd>'+p.scenarios.length+'</dd></div><div><dt>执行</dt><dd>'+rs.length+'</dd></div><div><dt>通过率</dt><dd>'+passRate(rs)+'</dd></div><div><dt>变量</dt><dd>'+p.vars.length+'</dd></div></dl>'
   +'<div class="pf">'+strip(rs)+(last?'<span class="mut">最近 '+last.at+'</span>':'')+'</div></button>'});
 h+='</div><h3>最近执行</h3><div class="card"><table><tr><th>Run ID</th><th>项目</th><th>场景</th><th>状态</th><th>触发</th><th>时间</th></tr>';
 DB.runs.slice(0,6).forEach(function(r){var p=DB.projects.find(function(x){return x.id===r.p}),s=p.scenarios.find(function(x){return x.id===r.sc});
  h+='<tr class="click" onclick="go({view:\'run\',p:\''+r.p+'\',run:\''+r.id+'\',step:0})"><td><code>'+r.id+'</code></td><td>'+p.name+'</td><td>'+s.id+' '+s.name+'</td><td>'+badge(r.st)+'</td><td>'+r.by+'</td><td class="mut">'+r.at+'</td></tr>'});
 return h+'</table></div></div>'}
function newProjectForm(){
 return '<div class="card form"><b>新建项目</b><div class="fgrid">'
  +'<label>名称<input id="np-name" placeholder="如 HTinns 新平台"></label>'
  +'<label>项目 ID<input id="np-id" placeholder="小写字母/数字/短横线，如 htinns"></label>'
  +'<label>被测地址<input id="np-url" placeholder="http://127.0.0.1:5005"></label>'
  +'<label>说明<input id="np-desc" placeholder="可选"></label></div>'
  +'<div id="np-err" class="err"></div><div class="row" style="justify-content:flex-start;margin:0"><button class="pri" onclick="createProject()">创建并配置变量</button><button onclick="go({creating:false})">取消</button></div></div>'}
function createProject(){var v=function(i){return document.getElementById(i).value.trim()},err=document.getElementById('np-err');
 var name=v('np-name'),id=v('np-id'),url=v('np-url');
 if(!name){err.textContent='请填写项目名称';return}
 if(!/^[a-z][a-z0-9-]{1,31}$/.test(id)){err.textContent='项目 ID 需以小写字母开头，只含小写字母、数字、短横线，2-32 位';return}
 if(DB.projects.some(function(p){return p.id===id})){err.textContent='项目 ID「'+id+'」已存在';return}
 if(!/^https?:\/\/\S+$/.test(url)){err.textContent='被测地址需以 http:// 或 https:// 开头';return}
 DB.projects=DB.projects.concat([{id:id,name:name,desc:v('np-desc')||'—',baseUrl:url,vars:[{k:'BASE_URL',v:url,secret:false,note:'被测服务地址'}],blocked:[],scenarios:[]}]);
 go({view:'project',p:id,tab:'vars',creating:false,edit:null,reveal:{}})}
function viewProject(){var p=proj(),t=TABS.find(function(x){return x[0]===S.tab});
 var h='<div class="crumb"><a onclick="home()">首页</a> / '+p.name+'</div><h2>'+t[1]+'</h2>';
 if(S.tab==='scenarios')h+=tabScenarios(p);
 if(S.tab==='runs')h+=tabRuns(p,null);
 if(S.tab==='vars')h+=tabVars(p);
 if(S.tab==='guards')h+=tabGuards(p);
 return h}
function tabScenarios(p){
 var h='<div class="card"><div class="row"><span class="mut">场景定义存在仓库 <code>scenarios/*.yaml</code>，平台只读索引</span><button class="pri">运行全部</button></div><table><tr><th>ID</th><th>场景</th><th>角色</th><th>步骤</th><th>最近结果</th><th>执行次数</th><th></th></tr>';
 if(!p.scenarios.length)h+='<tr><td colspan="7" class="empty">还没有场景。在被测仓库的 <code>scenarios/</code> 下放入 YAML，或让 Claude Code 按需求生成，平台会自动索引。</td></tr>';
 p.scenarios.forEach(function(s){var rs=DB.runs.filter(function(r){return r.sc===s.id});
  h+='<tr><td>'+s.id+'</td><td><b>'+s.name+'</b></td><td class="mut">'+s.actors+'</td><td>'+s.steps+'</td><td>'+(rs[0]?badge(rs[0].st):'-')+'</td><td><a class="crumb" style="cursor:pointer;color:var(--pri)" onclick="go({tab:\'runs\',filter:\''+s.id+'\'})">'+rs.length+' 次</a></td><td><button onclick="go({view:\'run\',run:\'20261102-003\',step:0})">运行</button></td></tr>'});
 return h+'</table></div>'}
function tabRuns(p){var f=S.filter;
 var rs=DB.runs.filter(function(r){return r.p===p.id&&(!f||r.sc===f)});
 var h='<div class="card"><div class="row"><span>'+(f?'场景 <b>'+f+'</b> 的执行记录 <button class="link" onclick="go({filter:null})">清除筛选</button>':'全部执行记录')+'</span></div><table><tr><th>Run ID</th><th>场景</th><th>状态</th><th>耗时</th><th>触发</th><th>时间</th></tr>';
 if(!rs.length)h+='<tr><td colspan="6" class="empty">还没有执行记录。</td></tr>';
 rs.forEach(function(r){var s=p.scenarios.find(function(x){return x.id===r.sc});
  h+='<tr class="click" onclick="go({view:\'run\',run:\''+r.id+'\',step:0})"><td><code>'+r.id+'</code></td><td>'+r.sc+' '+s.name+'</td><td>'+badge(r.st)+(r.why?'<div class="mut">'+r.why+'</div>':'')+'</td><td>'+r.dur+'</td><td>'+r.by+'</td><td class="mut">'+r.at+'</td></tr>'});
 return h+'</table></div>'}
function tabVars(p){
 var h='<div class="card"><div class="row"><div><b>Global 环境变量</b><div class="mut">项目内所有场景可用，场景里用 <code>${var:NAME}</code> 引用。优先级：项目 global &lt; 场景 variables &lt; CLI --var。secret 加密存储，快照和日志一律脱敏。</div></div></div>';
 h+='<table><tr><th style="width:22%">Key</th><th style="width:30%">Value</th><th style="width:9%">Secret</th><th>说明</th><th style="width:110px"></th></tr>';
 p.vars.forEach(function(v,i){var shown=v.secret&&!S.reveal[i]?'••••••••':v.v;
  h+='<tr><td><code>'+v.k+'</code></td><td>'+shown+(v.secret?' <button class="link" onclick="S.reveal['+i+']=!S.reveal['+i+'];render()">'+(S.reveal[i]?'隐藏':'显示')+'</button>':'')+'</td><td>'+(v.secret?'是':'')+'</td><td class="mut">'+v.note+'</td><td><button class="link" onclick="editVar('+i+')">编辑</button><button class="link" style="color:var(--bad)" onclick="delVar('+i+')">删除</button></td></tr>'});
 var e=S.edit!=null?p.vars[S.edit]:{k:'',v:'',secret:false,note:''};
 h+='<tr><td><input id="vk" placeholder="NEW_KEY" value="'+e.k+'"></td><td><input id="vv" placeholder="value" value="'+(S.edit!=null?e.v:'')+'"></td><td><input id="vs" type="checkbox" style="width:auto" '+(e.secret?'checked':'')+'></td><td><input id="vn" placeholder="说明（可选）" value="'+e.note+'"></td><td><button class="pri" onclick="saveVar()">'+(S.edit!=null?'保存':'添加')+'</button></td></tr>';
 h+='</table><div id="verr" class="err"></div></div>';
 return h}
function saveVar(){var p=proj(),k=document.getElementById('vk').value.trim();
 if(!/^[A-Z][A-Z0-9_]*$/.test(k)){document.getElementById('verr').textContent='Key 需为大写字母、数字、下划线，且以字母开头';return}
 if(p.vars.some(function(x,i){return x.k===k&&i!==S.edit})){document.getElementById('verr').textContent='Key 已存在';return}
 var nv={k:k,v:document.getElementById('vv').value,secret:document.getElementById('vs').checked,note:document.getElementById('vn').value};
 p.vars=S.edit!=null?p.vars.map(function(x,i){return i===S.edit?nv:x}):p.vars.concat([nv]);S.edit=null;render()}
function editVar(i){S.edit=i;render()}
function delVar(i){var p=proj();p.vars=p.vars.filter(function(_,j){return j!==i});S.edit=null;render()}
function tabGuards(p){
 var h='<div class="card"><b>拦截的高危接口</b><div class="mut">命中后 route 层直接 abort，并记一次违规，场景判为失败。</div><table style="margin-top:8px">';
 (p.blocked.length?p.blocked:['（无）']).forEach(function(b){h+='<tr><td><code>'+b+'</code></td></tr>'});
 h+='</table></div><div class="card"><b>生产域名黑名单</b><div class="mut">baseUrl 命中时拒绝运行。</div><div style="margin-top:8px"><code>*.example-prod.com</code> <code>admin.prod.*</code></div></div>';
 return h}
function viewRun(){var r=DB.runs.find(function(x){return x.id===S.run}),p=proj(),s=p.scenarios.find(function(x){return x.id===r.sc});
 var h='<div class="crumb"><a onclick="home()">首页</a> / <a onclick="go({view:\'project\',tab:\'runs\',filter:null})">'+p.name+'</a> / Run '+r.id+'</div>';
 h+='<h2>'+s.id+' '+s.name+' '+badge(r.st)+'</h2>';
 h+='<div class="stat"><div><span class="mut">耗时</span><b>'+r.dur+'</b></div><div><span class="mut">步骤</span><b>'+RUN_STEPS.length+'</b></div><div><span class="mut">断言（确定性 / AI）</span><b>'+cnt('det')+' / '+cnt('ai')+'</b></div><div><span class="mut">触发</span><b style="font-size:16px">'+r.by+'</b><span class="mut">'+r.at+'</span></div></div>';
 h+='<div class="row" style="justify-content:flex-start"><button>下载 trace.zip</button><button>scenario.yaml 快照</button><button>变量快照（已脱敏）</button><button>summary.json</button></div>';
 var st=RUN_STEPS[S.step];
 h+='<div class="steps"><div class="card" style="padding:8px">';
 RUN_STEPS.forEach(function(x,i){h+='<div class="st '+(i===S.step?'on':'')+'" onclick="go({step:'+i+'})"><span class="mut">'+String(i+1).padStart(2,'0')+'</span> <b>'+x.id+'</b> '+badge(x.st)+'<div class="mut">['+x.as+'] '+x.expect+'</div></div>'});
 h+='</div><div><div class="card"><div class="row"><b>'+st.id+'</b><span class="mut">'+st.type+' · 角色 '+st.as+' · '+st.ms+'ms</span></div>';
 if(st.ins)h+='<div>指令：'+st.ins+'</div>';
 h+='<div>验收点：'+st.expect+'</div>';
 if(st.attempts)h+='<div class="warn" style="margin-top:8px">AI 重试后通过，状态 <b>passed_after_retry</b>，全部尝试都已保留：'+st.attempts.map(function(a){return '<div class="att">'+a+'</div>'}).join('')+'</div>';
 h+='<div class="shots" style="margin-top:12px"><div class="shot">'+String(S.step+1).padStart(3,'0')+'-before.png</div><div class="shot">'+String(S.step+1).padStart(3,'0')+'-after.png</div></div></div>';
 h+='<div class="card"><b>断言</b><table style="margin-top:6px"><tr><th>类型</th><th>预期</th><th>实际</th><th>结果</th></tr>';
 st.asserts.forEach(function(a){h+='<tr><td>'+a.t+' <span class="tag '+a.kind+'">'+(a.kind==='det'?'确定性':'AI')+'</span></td><td>'+a.exp+'</td><td class="mut">'+a.act+'</td><td>'+badge(a.ok?'passed':'failed')+'</td></tr>'});
 h+='</table></div></div></div>';
 return h}
function cnt(k){return RUN_STEPS.reduce(function(n,s){return n+s.asserts.filter(function(a){return a.kind===k}).length},0)}
function render(){var app=document.getElementById('app'),inProj=S.view!=='home';
 app.className=inProj?'app':'app solo';
 document.getElementById('side').hidden=!inProj;
 document.getElementById('side').innerHTML=inProj?side():'';
 document.getElementById('main').innerHTML=inProj?(S.view==='project'?viewProject():viewRun()):viewHome();
 window.scrollTo(0,0)}
render();
</script></body></html>
